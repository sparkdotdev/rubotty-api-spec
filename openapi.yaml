        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # files rubotty is holding on a community's behalf.
  # administrator only, all of it: each of these either mints a bearer
  # capability to bytes on the deployment's disk, moves one, or invalidates
  # one, and the upload writes bytes into the community's own storage.
  #
  # The secret that names a file is a UUID that is never stored, only its
  # digest, so the service cannot produce a download link for a file it is
  # merely looking at. Two consequences run through everything below. A
  # listing identifies a file by its id and never by its UUID, and minting a
  # new link is a rotation the caller has to supply the old UUID for.
  # ------------------------------------------------------------------
  /admin/communities/{slug}/files:
    get:
      operationId: listFilesAdmin
      summary: Every file this community is holding
      description: >-
        Newest first. No entry carries a UUID or a download link, since
        neither is recoverable from what is stored. A caller that has
        lost a file's UUID can no longer reach or rotate that file,
        though it can still be expired by id.
      tags: [Files, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The files, newest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
                required: [files]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoFileStore"
    post:
      operationId: uploadFileAdmin
      summary: Store a file and receive the UUID that names it
      description: >-
        The one route in this API that takes `multipart/form-data`. The
        file is streamed into storage, compressed and encrypted, and is
        never held whole.

        The community's own settings apply rather than any deployment
        default: whether it accepts files at all, how long it keeps
        them, and how large one may be. An administrator key is not a
        way around a setting an operator made.

        This multipart route is exempt from the 4 MiB text-body limit.
        Before parsing, the complete request is bounded by the largest
        configured file cap for the community, including room overrides,
        plus 64 KiB (65,536 bytes) of multipart overhead. The selected
        room or community file policy is then enforced on the file itself.

        `uuid` comes back here and from a rotation. It is not stored and
        cannot be asked for again. A caller that does not keep it can
        still see the file in a listing and expire it by id.
      tags: [Files, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/FileUpload"
      responses:
        "201":
          $ref: "#/components/responses/FileWithLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoFileStore"

  /admin/communities/{slug}/files/rotate:
    post:
      operationId: rotateFileAdmin
      summary: Replace a file's link, retiring the old one
      description: >-
        Give it the UUID you hold and it answers with a new one. The old
        link stops working the moment this returns, which is what a
        leaked link needs.

        The UUID has to be supplied because only its digest is stored.
        This is a real re-encryption: the file is unsealed with the old
        secret and written out again under a new one, so the time it
        takes grows with the file. It is streamed, so it is not also
        expensive in memory.

        The expiry is left where it was, so rotating changes who can
        reach a file and leaves its retention alone.

        A UUID that names nothing live and a UUID naming another
        community's file both answer 404.
      tags: [Files, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/FileSecret"
      responses:
        "200":
          $ref: "#/components/responses/FileWithLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoFileStore"

  /admin/communities/{slug}/files/expire:
    post:
      operationId: expireFileAdmin
      summary: Mark a file for deletion on the next reclaim pass
      description: >-
        Give it the UUID you hold and the file's expiry moves to now.
        The link stops working straight away, since a download only
        resolves a file whose expiry is still ahead of it, and the bytes
        go when the deployment next reclaims storage.

        Unlike a rotation this needs no key material, so the digest of
        the UUID is enough to find the file. The same 404 covers a UUID
        that names nothing live and one naming another community's file.
      tags: [Files, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/FileSecret"
      responses:
        "200":
          description: The file, with its expiry brought forward.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoFileStore"

  /admin/communities/{slug}/files/{id}:
    get:
      operationId: getFileAdmin
      summary: Read one file's record
      description: >-
        Addressed by the id a listing gives, since the UUID is not
        stored and cannot be used to look anything up. Carries no link,
        like the listing.
      tags: [Files, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The file.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoFileStore"
    delete:
      operationId: expireFileByIdAdmin
      summary: Mark a file for deletion without holding its UUID
      description: >-
        The same effect as the expire call, addressed by the id a
        listing gives instead of by the UUID, which makes it the only
        way to act on a file whose UUID nobody kept.

        Expiring touches no key material: the expiry is a stored field,
        and the bytes go when the deployment next reclaims storage.
        Rotation has no equivalent, since rotating has to unseal the
        file and so needs the secret.

        Calling it twice is harmless. A file already past its expiry is
        left where it is rather than having its deletion pushed further
        out.
      tags: [Files, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The file, with its expiry brought forward.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoFileStore"

  # ------------------------------------------------------------------
  # analytics and debug
  # ------------------------------------------------------------------
  /admin/communities/{slug}/stats:
    get:
      operationId: getCommunityStatsAdmin
      summary: Community analytics overview
      description: >-
        Administrator only: the overview spans moderation, membership
        and guest activity across a whole window. The same overview the
        dashboard's own front page computes.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The community's analytics overview for the default window.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/debug/info:
    get:
      operationId: getDebugInfoAdmin
      summary: Build and runtime facts for either process
      description: >-
        Administrator only. `source` selects which process answers:
        `web` (the default, the process serving this request), `bot`, or
        `all` for both.

        The bot reports its own version and commit rather than this
        process assuming both containers run the same build. A bot that
        cannot be reached says so under `reachable` and `error` instead
        of being omitted.
      tags: [Admin, Health]
      parameters:
        - $ref: "#/components/parameters/debugSource"
      responses:
        "200":
          description: Facts for the requested process or processes.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  web:
                    $ref: "#/components/schemas/ProcessInfo"
                  bot:
                    $ref: "#/components/schemas/ProcessInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/debug/logs:
    get:
      operationId: getDebugLogsAdmin
      summary: Recent log lines from either process
      description: >-
        Administrator only. Each process keeps its recent lines in a
        bounded in-memory ring buffer, so this is a live tail and a
        restart clears it.

        With `source=all` both processes' entries merge into one
        timestamp-sorted list, each tagged with where it came from.

        A source that cannot be read is reported under `errors`, so a
        partial answer is never mistaken for a complete one.
      tags: [Admin, Health]
      parameters:
        - $ref: "#/components/parameters/debugSource"
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [debug, info, warn, error, fatal] }
          description: This level and anything more severe, rather than an exact match.
        - name: limit
          in: query
          required: false
          schema: { type: integer }
          description: How many entries to return, newest first.
      responses:
        "200":
          description: Merged, timestamp-sorted entries, plus any per-source errors.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogEntry"
                  errors:
                    type: object
                    additionalProperties: { type: string }
                    description: Present only when a requested source could not be read.
                required: [entries]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/debug/backfill-gaps:
    get:
      operationId: getBackfillGapsAdmin
      summary: A read-only sweep for a gap the paced backfill's own resume point cannot reach
      description: >-
        Administrator only. Runs on the bot process, the only one holding a
        live platform connection, and is relayed here over the same internal
        hop debug/logs and debug/info already use.

        Every backfill-capable channel is swept over its full lookback window
        with no resume point, and each candidate message is classified as
        already claimed by the relay ledger, one of this bridge's own
        relayed copies, older than the safe horizon, or a genuine gap.
        Nothing here relays, posts or claims anything; it only reports what a
        real backfill would find.

        A finding names only the source endpoint, the platform's own message
        id and its timestamp, never the message itself.

        An unreachable bot is reported plainly under `errors`, rather than an
        empty channel list that would read as "nothing to recover".
      tags: [Admin, Health]
      responses:
        "200":
          description: One row per swept channel, worst first, plus any error reaching the bot.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackfillGapChannel"
                  errors:
                    type: object
                    additionalProperties: { type: string }
                    description: Present only when the bot process could not be reached.
                required: [channels]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # backfill proposals
  # ------------------------------------------------------------------
  /admin/backfill-proposals:
    get:
      operationId: listBackfillProposals
      summary: What a sweep held back, waiting on a decision
      description: >-
        A gap larger than the channel's own auto-relay limit is written down
        rather than sent, per channel, and goes out only when somebody accepts
        it. This is that list.


        Every row carries the counts the sweep recorded. `ours` is the one to
        read first: it is how many of the fetched messages the sweep
        recognised as this bridge's own relayed copies and skipped. A zero
        there on a channel that has bridged for months means the ownership
        check is not working, and accepting anything would push those copies
        back into a live room.


        Administrator only, and named by no slug: one sweep writes proposals
        across a community's channels, and accepting one posts into live
        rooms.
      tags: [Backfill, Admin]
      parameters:
        - $ref: "#/components/parameters/backfillProposalState"
      responses:
        "200":
          description: The proposals in the state asked for, freshest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  backfill_proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackfillProposal"
                required: [backfill_proposals]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/backfill-proposals/{id}:
    get:
      operationId: getBackfillProposal
      summary: Read one proposal and the messages it would send
      description: >-
        The stored list, exactly as an accept would relay it: nothing is
        recomputed here or at accept time, so what is read is what goes.


        A preview is kept only while the proposal still needs one. Once the
        proposal is rejected, expires, or has had its accepted list relayed,
        the previews are deleted and the row keeps the counts alone. That case
        answers `items_pruned: true` with a note saying so, rather than an
        empty list that would read as "the sweep was going to send nothing".
      tags: [Backfill, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The proposal, and its previews when it still holds any.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/BackfillProposalDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/backfill-proposals/{id}/approve:
    post:
      operationId: approveBackfillProposal
      summary: Accept one channel's list, and send it
      description: >-
        Accepting stamps the proposal and hands the stored list to the bot
        process, which is the only one holding the platform connections that
        can send. The send itself is paced and runs there, so this answers as
        soon as the bot has taken the list rather than when the last message
        has landed.


        `relaying` is whether the bot took it. False means the proposal is
        accepted but nothing is going out, with the reason under `errors`.


        Only a proposal still waiting on a decision can be accepted. One
        already decided, or one that has run out of time, answers 422 and no
        second decision is recorded.
      tags: [Backfill, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The accepted proposal, and whether the bot took the list.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  backfill_proposal:
                    $ref: "#/components/schemas/BackfillProposal"
                  item_count:
                    type: integer
                    description: How many stored messages were handed over.
                  relaying:
                    type: boolean
                    description: >-
                      Whether the bot process took the list. False means the
                      decision is recorded and nothing is being sent.
                  errors:
                    type: object
                    additionalProperties: { type: string }
                    description: Present only when the bot process could not be reached.
                required: [backfill_proposal, item_count, relaying]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/backfill-proposals/{id}/reject:
    post:
      operationId: rejectBackfillProposal
      summary: Refuse one channel's list
      description: >-
        Nothing from that channel is sent, and the previews go with the
        decision. The row stays, with its counts, so the history still says
        what was proposed and what happened to it.


        Only a proposal still waiting on a decision can be refused; one
        already decided answers 422.
      tags: [Backfill, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The refused proposal.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  backfill_proposal:
                    $ref: "#/components/schemas/BackfillProposal"
                required: [backfill_proposal]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A developer key (one community) or an administrator key (global),
        issued and revoked from the operator dashboard's key management page.
        Sent as `Authorization: Bearer <token>`. The key is resolved fresh on
        every request and never cached, so a revocation takes effect on the
        next call.

  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      example: sample
      description: Which community to act on. A developer key may only name its own.
    roomKey:
      name: room_key
      in: path
      required: true
      schema: { type: string }
      example: general
      description: Which room to act on. Unique within the community, never globally.
    endpointKey:
      name: endpoint_key
      in: path
      required: true
      schema: { type: string }
      example: tg-general
      description: Which bridged channel to act on.
    channelId:
      name: channel_id
      in: path
      required: true
      schema: { type: string }
      example: support-channel-42
      description: >-
        The remote system's OWN identifier for the conversation, exactly as
        it was given when this channel was mapped into a room. Never a
        rubotty room_key or endpoint_key.
    messageId:
      name: message_id
      in: path
      required: true
      schema: { type: string }
      description: >-
        The id a previous POST to this channel's messages answered with.
        Only a message created through this same /bridge surface can be
        addressed here.
    roomMessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string }
      description: >-
        The id a previous POST to this room's messages answered with. Only a
        message posted through that same room-level surface can be
        addressed here, never a bridge channel's own message_id.
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Which record to act on, as the id the matching list route reports.
    publicId:
      name: public_id
      in: path
      required: true
      schema: { type: string }
      description: The subscription's public identifier. Not the signing secret.
    authTokenPublicId:
      name: public_id
      in: path
      required: true
      schema: { type: string }
      description: The token's public identifier. Never the token string itself, which is not stored.
    faqEntryId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: a1b2c3d4
      description: The FAQ entry's stable id, as returned by list or add. Not an array position.
    feature:
      name: feature
      in: path
      required: true
      schema: { type: string }
      example: word_filter
      description: Which feature to act on. An unknown name is refused.
    nicknameAdapter:
      name: adapter
      in: path
      required: true
      schema: { type: string }
      example: discord
      description: >-
        Which platform the name is SHOWN on, never the platform the person was
        observed on. A name is held per platform, so this is part of what
        addresses it.
    debugSource:
      name: source
      in: query
      required: false
      schema: { type: string, enum: [web, bot, all], default: web }
      description: Which process to ask. Anything else is a 400, never a silent fallback.
    pendingSpaceState:
      name: state
      in: query
      required: false
      schema: { type: string, enum: [pending, denied, all], default: pending }
      description: >-
        Which spaces to list: those awaiting a decision, those refused and
        still standing as a refusal, or both. Anything else is a 400, never a
        silent fallback.
    backfillProposalState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [pending, approved, rejected, expired, relayed, all]
        default: pending
      description: >-
        Which proposals to list. `pending` is waiting on a decision,
        `approved` is accepted and waiting for the bot to finish sending it,
        `relayed` has gone out, `rejected` was refused, and `expired` ran out
        of time undecided. `all` merges every state into one ordering.
        Anything else is a 400, never a silent fallback.
    alertLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 200 }
      description: >-
        How many alerts to return. Clamped rather than refused, so asking for
        more than a community may hold answers with what there is.

  requestBodies:
    FeatureWrite:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/FeatureWriteBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/FeatureWriteBody"
    IntegrationWrite:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/IntegrationWriteBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/IntegrationWriteBody"
    ScriptWrite:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/ScriptWriteBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/ScriptWriteBody"
    ScriptEndpointWrite:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/ScriptEndpointWriteBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/ScriptEndpointWriteBody"
    IrcNetworkWrite:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/IrcNetworkWriteBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/IrcNetworkWriteBody"
    WebhookWrite:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/WebhookWriteBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/WebhookWriteBody"
    WebhookRotate:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/WebhookRotateBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/WebhookRotateBody"
    FileUpload:
      required: true
      description: >-
        The one multipart body in this API, exempt from the 4 MiB text-body
        limit. The complete request is bounded by the largest configured file
        cap for the community, including room overrides, plus 64 KiB
        (65,536 bytes) of multipart overhead. Storage also enforces the file
        cap selected by room_key, or the community default when it is absent.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The file itself. Streamed, so its size is bounded only by the community's cap.
              room_key:
                type: string
                description: >-
                  Which room the file belongs to. Optional, and used to resolve
                  the room's own settings where they differ from the
                  community's.
    FileSecret:
      required: true
      description: The UUID naming the file to act on.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/FileSecretBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/FileSecretBody"
    WordFilterReplace:
      required: true
      description: >-
        The complete replacement list. Form encoding carries it using the
        usual bracket notation, `entries[]=one&entries[]=two`.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/WordFilterReplaceBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/WordFilterReplaceBody"
    WordFilterRemove:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/WordFilterRemoveBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/WordFilterRemoveBody"
    FaqAdd:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/FaqAddBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/FaqAddBody"
    JoinLinksReplace:
      required: true
      description: >-
        The complete replacement list. Form encoding carries it using the
        usual bracket notation, `join_links[][platform]=discord&join_links[][url]=...`.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/JoinLinksReplaceBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/JoinLinksReplaceBody"
    RoomCreate:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/RoomCreateBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/RoomCreateBody"
    RoomDelete:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/RoomDeleteBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/RoomDeleteBody"
    CommunityStatus:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/CommunityStatusBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/CommunityStatusBody"
    MuteCreate:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/MuteCreateBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/MuteCreateBody"
    EventCreate:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/EventCreateBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/EventCreateBody"
    EventUpdate:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/EventUpdateBody"
        application/yaml:
          schema:
            $ref: "#/components/schemas/EventUpdateBody"

  responses:
    Community:
      description: The community.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Community"
    Feature:
      description: The feature settings for this scope.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Feature"
    RoomFeature:
      description: What the feature resolves to for this room, and where the answer came from.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/RoomFeature"
    PendingSpace:
      description: The space awaiting, or having just been given, a decision.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/PendingSpace"
    ContentPolicyMisfires:
      description: The content policy actions an operator reversed, newest first.
      content:
        application/yaml:
          schema:
            type: object
            properties:
              misfires:
                type: array
                items: { $ref: "#/components/schemas/ContentPolicyMisfire" }
            required: [misfires]
    WordFilterEntries:
      description: The scope's custom word and phrase list.
      content:
        application/yaml:
          schema:
            type: object
            properties:
              entries:
                type: array
                items: { type: string }
            required: [entries]
    FaqEntries:
      description: The scope's FAQ entries.
      content:
        application/yaml:
          schema:
            type: object
            properties:
              entries:
                type: array
                items:
                  $ref: "#/components/schemas/FaqEntry"
            required: [entries]
    JoinLinks:
      description: The scope's public join links.
      content:
        application/yaml:
          schema:
            type: object
            properties:
              join_links:
                type: array
                items:
                  $ref: "#/components/schemas/JoinLink"
            required: [join_links]
    RoomProvisioningRequest:
      description: The provision request the running bot will complete.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/RoomProvisioningRequest"
    Mute:
      description: The active mute, or the same mute just lifted.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Mute"
    Mutes:
      description: Every active manual mute in this community.
      content:
        application/yaml:
          schema:
            type: object
            properties:
              mutes:
                type: array
                items:
                  $ref: "#/components/schemas/Mute"
            required: [mutes]
    Event:
      description: The event.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Event"
    Script:
      description: The script.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Script"
    Scripts:
      description: A list of scripts.
      content:
        application/yaml:
          schema:
            type: object
            properties:
              scripts:
                type: array
                items:
                  $ref: "#/components/schemas/Script"
            required: [scripts]
    ScriptEndpoint:
      description: The endpoint.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/ScriptEndpoint"
    IrcNetwork:
      description: The IRC network.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/IrcNetwork"
    Webhook:
      description: The subscription. Never carries the signing secret.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Webhook"
    WebhookCreated:
      description: >-
        The subscription, with the signing secret. One of only two responses
        that carry it.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/WebhookWithSecret"
    BridgeQueued:
      description: >-
        The edit, delete or reaction was accepted onto the queue. No
        platform has seen it yet.
      content:
        application/yaml:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [queued]
            required: [status]
    Unauthorized:
      description: Missing, malformed, unknown, or revoked bearer token.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        A developer key called an administrator-only route. Confirms nothing
        about whether any particular resource exists.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        Either the resource does not exist, or it belongs to a community the
        current key cannot see. Both return the identical body.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: >-
        A request body that is not a YAML mapping, a config value that is not a
        mapping, or a query parameter outside its allowed set.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: >-
        The write was refused: an unknown feature name, a script that will not
        compile, an endpoint name already taken, and similar. The message says
        which.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    FileWithLink:
      description: >-
        The file, with the UUID that names it and the download link built from
        it. One of only two responses that carry either.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/FileWithLink"
    RequestTooLarge:
      description: >-
        The non-multipart request body exceeds 4 MiB (4,194,304 bytes).
        The limit is checked against both declared length and bytes consumed,
        before the oversized body can be fully parsed.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: >-
        The file exceeds the selected community or room policy, or the complete
        multipart request exceeds the upload envelope limit. The envelope uses
        the largest configured file cap for that community, including room
        overrides, plus 64 KiB (65,536 bytes). The selected file policy still
        applies to the file itself. Refused while reading.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    NoFileStore:
      description: >-
        This deployment has no usable file storage, so nothing can be held,
        rotated or expired.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The bearer key's per-window request budget is exhausted. The default budget is 60 requests per 60 seconds.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: "What went wrong, in one sentence." }
      required: [error]

    ContentPolicyMisfire:
      type: object
      description: >-
        One content policy match an operator called wrong, kept as a sample
        for improving the policy's wording.
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [false_positive, miss]
          description: >-
            Which mistake this sample is. false_positive is a match an operator
            reversed with /vindicate; miss is a message an operator named with
            /condemn because the policies should have caught it and did not. A
            description rewritten against only one of the two gets worse at the
            other, so both live in one corpus.
        policy:
          type: string
          nullable: true
          description: The policy entry's own name, as it read when the match was made.
        action:
          type: string
          enum: [notify, flag_notify, warn_and_delete, delete]
          description: What had been done before the reversal undid it.
        adapter: { type: string }
        endpoint_id: { type: string }
        body:
          type: string
          nullable: true
          description: The text the policy matched.
        reasoning:
          type: string
          nullable: true
          description: The model's own one sentence explanation for the match.
        confidence:
          type: number
          nullable: true
          description: How sure the match was, from 0 to 1.
        statement:
          type: string
          nullable: true
          description: Why the operator disagreed, in their own words.
        context:
          type: object
          nullable: true
          description: >-
            What the check was looking at besides the message: the room's
            preceding lines and whatever the message replied to, as the model
            was given them and already truncated. Without it a sample cannot
            say whether a verdict came from the message or from the room
            around it. The other speakers carry stable labels rather than
            names, for the same reason no author is kept on the sample itself.
            Null on a row recorded before this was captured.
          properties:
            recent_messages:
              type: array
              items:
                type: object
                properties:
                  author: { type: string }
                  text: { type: string }
            replying_to:
              type: object
              nullable: true
              properties:
                author: { type: string }
                text: { type: string }
        reversed_by:
          type: string
          nullable: true
          description: The operator who reversed it, as adapter and handle.
        acted_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: When the policy fired.
        created_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: When an operator called it wrong.
      required: [id, action, adapter, endpoint_id, acted_at, created_at]

    Timestamp:
      type: string
      description: >-
        A wall-clock timestamp with an offset, for example
        "2026-07-29 16:37:40 +0100". Not RFC 3339. The one exception in this
        API is a log entry's time, which is UTC ISO 8601.
      example: "2026-07-29 16:37:40 +0100"

    NullableTimestamp:
      type: string
      nullable: true
      description: >-
        The same shape as Timestamp, or null for something that has not
        happened.
      example: "2026-07-29 16:37:40 +0100"

    Community:
      type: object
      properties:
        slug: { type: string, description: "The community's identifier in every path." }
        name: { type: string, description: "The community's display name." }
        status:
          type: string
          enum: [active, suspended]
          description: Whether the community is running. A suspended one relays nothing.
        created_at:
          $ref: "#/components/schemas/Timestamp"
      required: [slug, name, status, created_at]

    Room:
      type: object
      properties:
        room_key:
          type: string
          description: The room's identifier. Unique within the community, never globally.
        label:
          type: string
          nullable: true
          description: The room's display name, or null when it has none.
        channels:
          type: array
          items: { type: string }
          description: The endpoint keys of every channel bridged into this room.
      required: [room_key, channels]

    RoomCreateBody:
      type: object
      properties:
        name:
          type: string
          description: The room and platform-channel name to create.
        platforms:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              adapter: { type: string, description: "The platform adapter." }
              account: { type: string, description: "The connected account on that platform." }
            required: [adapter, account]
        template_channel:
          type: string
          description: An existing endpoint key whose permissions may be copied where supported.
      required: [name, platforms]

    RoomDeleteBody:
      type: object
      properties:
        confirmed_name:
          type: string
          description: The room label or key, repeated to confirm deletion.
        delete_platform_channels:
          type: boolean
          default: false
          description: Whether platform channels created by the bot should be removed too.
        force_endpoint_keys:
          type: array
          items: { type: string }
          description: Existing channels to remove even though the bot did not create them.
      required: [confirmed_name]

    RoomProvisioningRequest:
      type: object
      properties:
        status: { type: string, enum: [requested] }
        room:
          oneOf:
            - $ref: "#/components/schemas/Room"
            - type: object
              nullable: true
              enum: [null]
      required: [status, room]

    CommunityStatusBody:
      type: object
      properties:
        status: { type: string, enum: [active, suspended] }
      required: [status]

    Mute:
      type: object
      properties:
        id: { type: integer, description: "The mute's identifier within the community." }
        adapter: { type: string, description: "The muted user's platform." }
        native_id: { type: string, description: "The muted user's platform identifier." }
        username:
          type: string
          nullable: true
          description: The last known platform handle, or null when none was supplied.
        until_at:
          $ref: "#/components/schemas/NullableTimestamp"
        active: { type: boolean, description: "Whether the mute is still in force." }
      required: [id, adapter, native_id, active]

    MuteCreateBody:
      type: object
      properties:
        adapter: { type: string, description: "The user's platform." }
        native_id: { type: string, description: "The user's platform identifier." }
        username: { type: string, description: "The user's platform handle, when known." }
        display: { type: string, description: "A human-readable name for the audit log." }
        duration:
          oneOf:
            - type: string
            - type: integer
          description: Seconds, or a compact duration such as 30m, 1h or 1d. Omit for an indefinite mute.
        reason: { type: string, description: "Why the mute was issued." }
      required: [adapter, native_id]

    Channel:
      type: object
      properties:
        endpoint_key:
          type: string
          description: The channel's identifier within the community.
        adapter:
          type: string
          description: Which platform this channel is on, such as telegram or discord.
        account:
          type: string
          description: The gateway account that holds the credential for it.
        label:
          type: string
          nullable: true
          description: The channel's display name, or null when it has none.
        receives:
          type: boolean
          description: Whether messages from this channel are relayed into the room.
        sends:
          type: boolean
          description: Whether messages from the room are relayed to this channel.
      required: [endpoint_key, adapter, account, receives, sends]

    MessageWriteBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 4000
          description: The message text. Empty or over the limit is a 422.

    BridgeAuthor:
      type: object
      description: >-
        The real person on the remote system who took the action, so a
        room sees who actually said or did something rather than the
        integration's own name every time.
      properties:
        id:
          type: string
          description: The remote system's own stable id for this person.
        name:
          type: string
          description: Display name shown in the room.
        avatar_url:
          type: string
          description: A publicly fetchable image URL. Optional.

    BridgeAttachment:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "A publicly fetchable URL. Required." }
        filename: { type: string }
        mime_type: { type: string }
        kind:
          type: string
          description: >-
            A hint such as "photo", "video" or "document". Unrecognised or
            omitted falls back to a generic file.
        caption: { type: string }

    BridgeAuthorOnlyBody:
      type: object
      properties:
        author:
          $ref: "#/components/schemas/BridgeAuthor"

    BridgeMessageWriteBody:
      type: object
      properties:
        body:
          type: string
          maxLength: 4000
          description: >-
            The message text. May be empty only when at least one
            attachment is given.
        author:
          $ref: "#/components/schemas/BridgeAuthor"
        reply_to:
          type: string
          description: >-
            The message_id of an earlier post in this same channel that
            this one replies to. Omitted for an ordinary message.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/BridgeAttachment"

    BridgeEditWriteBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 4000
          description: The message's new text. Empty is a 422.
        author:
          $ref: "#/components/schemas/BridgeAuthor"

    BridgeReactionWriteBody:
      type: object
      required: [reaction]
      properties:
        author:
          $ref: "#/components/schemas/BridgeAuthor"
        reaction:
          type: object
          description: Exactly one of emoji or custom_id is required.
          properties:
            emoji:
              type: string
              description: A unicode emoji, or the one a custom emoji is drawn from.
            custom_id:
              type: string
              description: This remote system's own id for a custom emoji.
            custom_name:
              type: string
              description: A custom emoji's shortcode, shown where the native image cannot cross platforms.

    BridgeMemberWriteBody:
      type: object
      required: [author]
      description: >-
        Who arrived or left. author.id is required here, unlike elsewhere:
        a membership event naming nobody says only that somebody somewhere
        came or went, which no room can render.
      properties:
        author:
          $ref: "#/components/schemas/BridgeAuthor"

    BridgeMessageQueued:
      type: object
      properties:
        status:
          type: string
          enum: [queued]
        message_id:
          type: string
          description: >-
            This message's new id. Address it with PATCH, DELETE or a
            reactions call on this same channel to act on it later.
      required: [status, message_id]

    MetaEditWriteBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 4000
          description: The message's new text. Empty is a 422.

    MetaReactionWriteBody:
      type: object
      required: [reaction]
      properties:
        reaction:
          type: object
          description: Exactly one of emoji or custom_id is required.
          properties:
            emoji:
              type: string
              description: A unicode emoji, or the one a custom emoji is drawn from.
            custom_id:
              type: string
              description: A custom emoji's id, on whichever platform it was placed from.
            custom_name:
              type: string
              description: A custom emoji's shortcode, shown where the native image cannot cross platforms.

    StreamFrame:
      type: object
      description: >-
        One frame's YAML document. The opening frame carries an empty
        `messages` list and the cursor the stream starts from.
      properties:
        room_key: { type: string, description: "The room this frame came from." }
        cursor:
          type: integer
          description: The id of the last message in this frame, echoed back as the event id.
        messages:
          type: array
          description: The messages in this frame, oldest first. Empty on the opening frame.
          items:
            $ref: "#/components/schemas/StreamMessage"
      required: [room_key, cursor, messages]

    StreamMessage:
      type: object
      description: >-
        One buffered message. There is no per-platform id, since the buffer
        records what the room saw rather than each platform's copy of it.
      properties:
        id:
          type: integer
          description: The message's id in the room buffer. This is what a cursor names.
        origin:
          type: string
          nullable: true
          description: The endpoint key the message arrived on.
        author:
          type: string
          nullable: true
          description: Who sent it, as a display name, or null when the bridge recorded none.
        body: { type: string, description: "The message text." }
        kind:
          type: string
          description: What the bridge recorded this as, "chat" for ordinary traffic.
        at:
          $ref: "#/components/schemas/Timestamp"
      required: [id, body, kind, at]

    MappingApplyBody:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          description: The mappings to apply, normally the subset of the proposals the caller agrees with.
          items:
            type: object
            required: [endpoint_key, room_key]
            properties:
              endpoint_key:
                type: string
                description: The discovered channel to map.
              room_key:
                type: string
                description: The room to map it into, created if it does not exist.
              room_label:
                type: string
                description: Human-facing name for a room being created. Ignored when the room already exists.

    MapChannelBody:
      type: object
      description: >-
        Where the channel should land. Give exactly one of `room_key`,
        `partner` or `solo`; giving none is refused.
      properties:
        room_key:
          type: string
          description: >-
            An existing room to join, or the key for a fresh one. A channel
            already in that room is reconciled alongside.
        partner:
          type: string
          description: >-
            Another discovered, unmapped channel to seed a new room with, by
            its endpoint key. Naming this channel itself is refused.
        solo:
          type: boolean
          description: Put this channel in a room of its own.
        label:
          type: string
          description: Human-facing name for a room being created. Ignored when the room already exists.

    PendingSpace:
      type: object
      description: >-
        One space the bot was added to, and where its review stands. It
        belongs to no community until somebody approves it.
      properties:
        id: { type: integer, description: "Which space to act on." }
        adapter: { type: string, description: "Which platform it is on." }
        account: { type: string, description: "Which of the bot's credentials was in the space." }
        external_id: { type: string, description: "The platform's own id for the space." }
        name:
          type: string
          nullable: true
          description: The space's title as reported when the bot arrived, or null when none was.
        state:
          type: string
          enum: [pending, approved, denied]
          description: Whether it is awaiting a decision, accepted, or refused.
        inviter_username:
          type: string
          nullable: true
          description: Who added the bot, by handle, or null when the arrival carried no inviter.
        inviter_display:
          type: string
          nullable: true
          description: Who added the bot, by display name, or null.
        can_make_operator:
          type: boolean
          description: >-
            Whether `make_operator` on an approve would do anything. It needs
            the inviter's platform identity, which an arrival may never have
            carried.
        member_count:
          type: integer
          nullable: true
          description: How many members the space reported, best effort, or null when unknown.
        sample_channels:
          type: array
          items: { type: string }
          description: A few of the space's channel names, as a sense of what it is.
        community:
          type: string
          nullable: true
          description: The slug of the community it was accepted onto. Null until approved.
        decided_by:
          type: string
          nullable: true
          description: Who decided, or null while it is still awaiting one.
        decided_at:
          $ref: "#/components/schemas/NullableTimestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      required: [id, adapter, account, external_id, state, can_make_operator, sample_channels]

    PendingSpaceApproveBody:
      type: object
      description: >-
        Where the space should land. Give either `community` or
        `new_community_name`; giving neither is refused.
      properties:
        community:
          type: string
          description: An existing community's slug to accept the space onto.
        new_community_name:
          type: string
          description: >-
            A name for a brand new community to create for the space. Its slug
            is derived from the name and made unique.
        make_operator:
          type: boolean
          description: >-
            Promote whoever added the bot to operator of the community. Does
            nothing when `can_make_operator` is false.

    SpaceSuggestion:
      type: object
      description: One pending space, and the community its name looks like it belongs to.
      properties:
        matched:
          type: array
          items: { type: string }
          description: The words the two names had in common, so the guess can be judged.
        pending_space:
          $ref: "#/components/schemas/PendingSpace"
      required: [matched, pending_space]

    MappingProposal:
      type: object
      description: >-
        One discovered channel and what to do with it. "bind" points at a room
        that already exists, "create" at a room key that does not yet, and
        "skip" carries a reason and no room.
      properties:
        endpoint_key:
          type: string
          description: The discovered channel this proposal is about.
        channel_label:
          type: string
          nullable: true
          description: The channel's name on its platform, or null when it has none.
        action:
          type: string
          enum: [bind, create, skip]
          description: What applying this proposal would do.
        room_key:
          type: string
          nullable: true
          description: The room to bind to or create. Null on a skip.
        room_label:
          type: string
          nullable: true
          description: The display name for a room being created. Null otherwise.
        reason:
          type: string
          nullable: true
          description: Why a skipped channel was left alone. Null otherwise.
      required: [endpoint_key, action]

    PersonIdentity:
      type: object
      properties:
        adapter: { type: string, description: "Which platform this identity is on." }
        native_id:
          type: string
          nullable: true
          description: The platform's own id for the account, or null when it was never seen.
        username:
          type: string
          nullable: true
          description: The account's handle on that platform, or null when it has none.
      required: [adapter]

    Person:
      type: object
      properties:
        id: { type: integer, description: "The person's id within the community." }
        name: { type: string, description: "The name the directory shows for this person." }
        identities:
          type: array
          description: Every platform account observed to be this person.
          items:
            $ref: "#/components/schemas/PersonIdentity"
        nicknames:
          $ref: "#/components/schemas/Nicknames"
      required: [id, name, identities, nicknames]

    Nicknames:
      type: object
      description: >-
        What this person is bridged as, keyed by the platform each name is
        shown on. Empty when they have chosen none, which is the ordinary case:
        without one they are shown under the label the bridge builds from their
        real account. A person holds at most one name per platform, and a name
        is unique within a community and platform.
      additionalProperties:
        type: string
        description: The name shown on that platform.
      example:
        discord: Sam
      required: []

    NicknameWriteBody:
      type: object
      properties:
        nickname:
          type: string
          description: >-
            The name to be shown under. A display name, so spaces, accents and
            emoji all belong in one; control, zero-width and invisible
            characters do not, and neither does `@`, which is how a mention
            names a platform. Between 2 and 64 characters as a reader counts
            them.
          example: Sam
      required: [nickname]

    Operator:
      type: object
      description: >-
        One person's granted authority to moderate this community, as a record
        the revoke route can address.
      properties:
        id: { type: integer, description: "The operator grant's id within the community." }
        person: { type: string, description: The operator's person name. }
        actions:
          description: What this operator may do, as the literal string "all" or a list of action names.
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        scope:
          description: Where they may do it, as the literal string "all" or a list of room keys.
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        granted_at:
          $ref: "#/components/schemas/Timestamp"
        granted_by:
          type: string
          nullable: true
          description: Who granted it, or null when nobody was recorded.
        baked_in:
          type: boolean
          description: Always false. This authority was granted, so it can be taken back.
        removable:
          type: boolean
          description: Always true.
      required: [id, person, actions, scope, granted_at, baked_in, removable]

    BakedInOperator:
      type: object
      description: >-
        A handle the deployment ships with as an owner. It is owner-level in
        this community and in every other one by virtue of the handle alone, so
        it carries no id and no grant record: there is nothing to address and
        nothing to revoke. Listed here because leaving it out reported that
        nobody moderated communities several people did.
      properties:
        handle: { type: string, description: "The handle as it is matched." }
        kind:
          type: string
          description: >-
            "username" for a bare handle, "matrix" for a fully qualified
            federated id, or "telegram_id"/"discord_id" for a platform native
            id.
        actions:
          type: string
          description: Always "all".
        scope:
          type: string
          description: Always "all".
        baked_in:
          type: boolean
          description: Always true.
        removable:
          type: boolean
          description: Always false.
      required: [handle, kind, actions, scope, baked_in, removable]

    OperatorGrant:
      type: object
      description: >-
        Who to promote, named by their account on one platform. A person record
        is created for them when they have none.
      properties:
        adapter:
          type: string
          description: Which platform the account is on.
          example: telegram
        native_id:
          type: string
          description: The platform's own id for the account. The reliable half of the name.
          example: "80000010"
        username:
          type: string
          description: Their handle on that platform, recorded alongside the id when it is known.
        display:
          type: string
          description: Their display name, used to name a freshly created person record.
      required: [adapter, native_id]

    SuggestedChannel:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          properties:
            id:
              type: integer
              description: How the approve and reject routes address this suggestion.
          required: [id]

    OperatorRequest:
      type: object
      properties:
        id: { type: integer, description: "The request's id within the community." }
        adapter: { type: string, description: "The platform the request was made from." }
        requester_username:
          type: string
          nullable: true
          description: The requester's handle on that platform, or null when it has none.
        requester_display:
          type: string
          nullable: true
          description: The requester's display name, or null when the bridge recorded none.
        state:
          type: string
          enum: [pending, approved, denied, expired]
          description: Where the request stands.
        requested_at:
          $ref: "#/components/schemas/Timestamp"
        decided_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required: [id, adapter, state, requested_at]

    Feature:
      type: object
      properties:
        scope:
          type: string
          enum: [community, room]
          description: Whether this row is the community default or one room's override.
        room_key:
          type: string
          nullable: true
          description: The room this override belongs to. Null on a community row.
        feature: { type: string, description: "Which feature this row configures." }
        enabled: { type: boolean, description: "Whether the feature is on for this scope." }
        config:
          $ref: "#/components/schemas/FeatureConfig"
      required: [scope, feature, enabled, config]

    RoomFeature:
      allOf:
        - $ref: "#/components/schemas/Feature"
        - type: object
          properties:
            inherited:
              type: boolean
              description: >-
                Whether this is the community-wide default the room falls back
                to. False when the room carries an override of its own, in
                which case `scope` is `room`.
          required: [inherited]

    FeatureWriteBody:
      type: object
      description: Both fields optional. A PATCH may set either alone or both together.
      properties:
        enabled: { type: boolean, description: "Turn the feature on or off for this scope." }
        config:
          allOf:
            - $ref: "#/components/schemas/FeatureConfig"
            - description: >-
                One or more config keys, each run through the same value
                coercion a dashboard edit takes, and merged key by key into
                whatever the scope already holds. Sending a key a feature does
                not declare is accepted and stored rather than refused, which
                is why this is described as an open mapping rather than as a
                closed set per feature. Read `GET /features/schema` for the
                keys that mean something.

    FeatureConfig:
      type: object
      description: >-
        A feature's settings for one scope, as a mapping from a config key to
        its value. A value is an ordinary scalar, list or mapping, matching the
        type the key declares: a `duration` is either a plain number of seconds
        or a string such as "24 hours", and a key declared as a choice carries
        one of its permitted strings.


        Which keys a given feature takes, their types, their defaults and the
        values they are restricted to are deliberately NOT enumerated here.
        They belong to the release a deployment is actually running, while this
        document is read beside deployments on other releases, so a copy here
        would describe some other deployment's features as though they were
        yours. `GET /features/schema` answers for the deployment being talked
        to, from the same declarations the operator dashboard builds its
        per-feature config form from; look up the entry whose `name` matches
        this row's `feature`.


        The mapping is open for a second reason as well: a scope can still hold
        a key from a release where the feature declared it and this one does
        not, and that key is reported here rather than hidden.
      additionalProperties: true

    FeatureSchema:
      type: object
      description: One feature's config shape, as `GET /features/schema` lists it.
      properties:
        name: { type: string, description: "The feature's stable name, matching Feature.feature." }
        description: { type: string, description: "One plain-English sentence on what the feature does." }
        retention_notice:
          type: string
          nullable: true
          description: What turning the feature on makes this deployment keep, or null when it keeps nothing extra.
        config_schema:
          type: array
          description: >-
            The feature's config keys. Empty for a feature that takes no
            config at all, which is itself useful to know.
          items:
            $ref: "#/components/schemas/ConfigField"
      required: [name, description, retention_notice, config_schema]

    ConfigField:
      type: object
      description: One config key a feature's `config` accepts.
      properties:
        name: { type: string, description: "The key, as it appears under Feature.config." }
        type:
          type: string
          enum: [string, integer, float, boolean, symbol, array, hash, duration, any]
          description: >-
            The value's shape. `duration` accepts either a plain number of
            seconds or a string such as "24 hours". `symbol` and `string`
            are both written as a plain string on the wire.
        required: { type: boolean, description: "Whether the key must be set. Most are not: they fall back to default." }
        default:
          description: The value used when the key is absent. Null when there is none.
        one_of:
          type: array
          nullable: true
          items: { type: string }
          description: The permitted values, or null when the key is not restricted to a fixed set.
        description:
          type: string
          nullable: true
          description: What the key controls, or null when the feature declares none.
      required: [name, type, required, default, one_of, description]

    FaqEntry:
      type: object
      description: Exactly one of command or keyword is present, matching how the entry was added.
      properties:
        id: { type: string, description: An 8-hex-character stable id. }
        command: { type: string, description: "The slash command that triggers this reply." }
        keyword: { type: string, description: "The word in a message that triggers this reply." }
        response: { type: string, description: "What the bot answers with." }
      required: [id, response]

    JoinLink:
      type: object
      properties:
        platform: { type: string, description: "Which platform the link joins." }
        label: { type: string, description: "The link's display name on the platforms page." }
        url: { type: string, format: uri, description: "The public invite address." }
      required: [platform, label, url]

    WordFilterReplaceBody:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { type: string }
          description: The complete replacement list of words and phrases.

    WordFilterRemoveBody:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: The exact word or phrase to remove, matching what list reports.

    FaqAddBody:
      type: object
      required: [response, trigger, trigger_type]
      properties:
        trigger:
          type: string
          description: The command name or keyword text.
        response:
          type: string
          description: What the bot answers with.
        trigger_type:
          type: string
          enum: [command, keyword]
          description: "\"command\" stores trigger under FaqEntry.command; anything else stores it under FaqEntry.keyword."

    JoinLinksReplaceBody:
      type: object
      required: [join_links]
      properties:
        join_links:
          type: array
          description: >-
            The complete replacement list. A row with no url is silently
            dropped rather than refused.
          items:
            type: object
            required: [url]
            properties:
              platform: { type: string, description: "Which platform the link joins." }
              label:
                type: string
                description: >-
                  The link's display name. Defaults to the platform name,
                  capitalised, or "Join" when platform is also absent.
              url: { type: string, format: uri, description: "The public invite address." }

    PlatformConnection:
      type: object
      properties:
        id: { type: integer, description: "The connection's id." }
        adapter: { type: string, description: "Which platform the connection is on." }
        account:
          type: string
          description: The gateway account that holds the credential for it.
        external_id:
          type: string
          description: The platform's own id for the space this connection sits in.
        label:
          type: string
          nullable: true
          description: The space's display name, or null when it has none.
      required: [id, adapter, account, external_id]

    IrcNetwork:
      type: object
      properties:
        name: { type: string, description: "The network's identifier within the community." }
        host: { type: string, description: "The server to connect to." }
        port: { type: integer, description: "The port to connect on." }
        tls: { type: boolean, description: "Whether the connection is encrypted." }
        nick: { type: string, description: "The nickname the bot connects under." }
        sasl_user:
          type: string
          nullable: true
          description: The SASL account name, or null when the network needs none.
        sasl_password_env:
          type: string
          nullable: true
          description: The NAME of the environment variable holding the SASL password, never the password.
        channels:
          type: array
          items: { type: string }
          description: The channels on this network the bot joins.
        mode:
          type: string
          enum: [per_room, hub]
          description: per_room gives each channel its own room. hub puts them all in one.
        hub_channel:
          type: string
          nullable: true
          description: Required, and only used, when mode is hub. Null for a per_room network.
        channel_keys:
          type: object
          additionalProperties: { type: string }
          description: >-
            Channel name to the NAME of the environment variable holding
            that channel's +k key, never the raw key.
      required: [name, host, port, tls, nick, channels, mode]

    FluxerInstance:
      type: object
      properties:
        label: { type: string, description: "The instance's identifier within the community." }
        kind:
          type: string
          enum: [flagship, self_hosted]
          description: Whether this is the hosted flagship or a community's own instance.
        endpoint_url:
          type: string
          nullable: true
          description: Where a self-hosted instance lives. Null for the flagship.
        api_key_env:
          type: string
          description: The NAME of the environment variable holding the API key, never the key.
      required: [label, kind, api_key_env]

    Integration:
      type: object
      description: >-
        A deployment-wide connection to an outside service. Unlike an
        account or a Fluxer instance, the credential is stored in the
        database rather than named by an environment variable; api_key_set
        is all this ever reveals about it.
      properties:
        name: { type: string, description: "Which integration this is, e.g. libretranslate." }
        url:
          type: string
          nullable: true
          description: The connection's endpoint, or null when not yet configured.
        api_key_set:
          type: boolean
          description: Whether an API key is stored. The key itself is never returned.
        config:
          type: object
          additionalProperties: true
          description: Whatever else this integration needs, e.g. libretranslate's allowed_pairs.
        updated_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required: [name, api_key_set, config]

    GuestInvite:
      type: object
      description: Never carries a token. Only a digest is stored.
      properties:
        id: { type: integer, description: "The invite's id within the community." }
        nickname: { type: string, description: "The name the guest appears under in the room." }
        room_key:
          type: string
          nullable: true
          description: The room the invite opens into, or null for the community's default.
        created_by:
          type: string
          nullable: true
          description: Who issued it, or null when nobody was recorded.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/NullableTimestamp"
        joined_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required: [id, nickname, expires_at]

    Event:
      type: object
      properties:
        id: { type: integer, description: "The event's id within the community." }
        room_key:
          type: string
          nullable: true
          description: The room the event belongs to, or null when it belongs to no room.
        title: { type: string, description: "The event's name." }
        description:
          type: string
          nullable: true
          description: The event's longer text, or null when it has none.
        starts_at:
          $ref: "#/components/schemas/Timestamp"
        ends_at:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          type: string
          nullable: true
          description: The zone the times are meant to be read in, or null when none was set.
        kind:
          type: string
          enum: [gaming, general]
          description: Which extra fields apply. A gaming event may carry a title and a server.
        game_title:
          type: string
          nullable: true
          description: What is being played, on a gaming event. Null otherwise.
        server_address:
          type: string
          nullable: true
          description: Where to join, on a gaming event. Null otherwise.
        url:
          type: string
          nullable: true
          description: A link for the event, or null when it has none.
        rsvp_mode:
          type: string
          enum: [none, affirm, full]
          description: Whether RSVPs are off, yes-only, or yes, no and maybe.
        status:
          type: string
          enum: [scheduled, cancelled, completed]
          description: Whether the event is still upcoming, cancelled or complete.
        reminder_intervals:
          type: array
          nullable: true
          items: { type: integer }
          description: Seconds before the event to remind, or null to use the room default.
        recurrence_interval:
          type: integer
          nullable: true
          description: Seconds between occurrences, or null for a one-off event.
      required: [id, title, starts_at, kind, rsvp_mode, status]

    EventCreateBody:
      type: object
      properties:
        title: { type: string, description: "The event name." }
        starts_at: { type: string, description: "When it starts, with an offset or read in timezone." }
        ends_at: { type: string, nullable: true, description: "When it ends, if known." }
        timezone: { type: string, nullable: true, description: "The zone for bare times." }
        kind: { type: string, enum: [gaming, general] }
        game_title: { type: string, description: "What is being played for a gaming event." }
        server_address: { type: string, description: "Where to join a gaming event." }
        url: { type: string, description: "A link for a general event." }
        description: { type: string, description: "Longer event text." }
        rsvp_mode: { type: string, enum: [none, affirm, full], default: none }
        reminder_intervals:
          type: array
          items: { type: integer, minimum: 1 }
          description: Seconds before the event to remind. An empty list turns reminders off.
        recurrence_interval:
          type: integer
          minimum: 1
          description: Seconds between occurrences.
      required: [title, starts_at, kind]

    EventUpdateBody:
      type: object
      properties:
        title: { type: string }
        starts_at: { type: string }
        ends_at: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        description: { type: string, nullable: true }
        url: { type: string, nullable: true }
        reminder_intervals:
          type: array
          items: { type: integer, minimum: 1 }
        recurrence_interval: { type: integer, nullable: true, minimum: 1 }

    Account:
      type: object
      properties:
        id: { type: integer, description: "The account's id on the deployment." }
        adapter: { type: string, description: "Which platform the account is on." }
        name: { type: string, description: "The account's name, unique for its adapter." }
        settings:
          type: object
          additionalProperties: true
          description: The token's environment variable NAME and per-adapter behaviour flags, never a raw secret.
        source:
          type: string
          enum: [yaml_seed, dashboard]
          description: >-
            Whether the account came from the deployment's config file or was
            added in the dashboard.
      required: [id, adapter, name, settings, source]

    ApiKey:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          description: How a key is named in the dashboard and the logs. Never the token.
        scope:
          type: string
          enum: [developer, administrator]
          description: Whether the key is confined to one community or sees them all.
        community:
          type: string
          nullable: true
          description: The community slug, or null for an administrator key.
        label: { type: string, description: "What the key was issued for." }
        created_by:
          type: string
          nullable: true
          description: Who issued it, or null when nobody was recorded.
        revoked_at:
          $ref: "#/components/schemas/NullableTimestamp"
        last_used_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required: [public_id, scope, label]

    ActionPermission:
      type: object
      description: >-
        One action's current deployment-wide state: whether ANY operator may
        take it at all, before that operator's own grant is even considered.
      properties:
        action:
          type: string
          description: >-
            The action's own name, either toggle_<feature>/configure_<feature>
            for a feature's two grants, or a fixed whole-section name
            (moderate_user, manage_rooms, manage_discovered,
            manage_operator_requests, manage_redirection, manage_alerts,
            manage_webhooks, manage_participation).
          example: toggle_word_filter
        label:
          type: string
          description: The human sentence this action reads as on the dashboard's grid.
          example: "Turn word filter on and off"
        group:
          type: string
          enum: [Features, Sections]
          description: Which half of the grid this action belongs to.
        operator_writable:
          type: boolean
          description: Whether any operator may currently take this action, deployment-wide.
      required: [action, label, group, operator_writable]

    ActionPermissionWrite:
      type: object
      description: >-
        A full replace of every action's state. Only the actions meant to end
        up writable need appear, and only with a truthy value; anything
        omitted, or sent explicitly false, becomes not writable.
      properties:
        permissions:
          type: object
          additionalProperties:
            type: boolean
          description: Action name to whether it should be writable.
          example: { moderate_user: true, manage_rooms: true, toggle_word_filter: true }
      required: [permissions]

    Viewer:
      type: object
      description: One granted holder of the viewer dimension, who reads every community and changes nothing.
      properties:
        id: { type: integer, description: "How the revoke route addresses this entry." }
        adapter: { type: string, description: "Which platform the handle belongs to." }
        handle:
          type: string
          description: >-
            The current display handle recorded with the grant. Authorization
            is bound to native_id, so recycling this handle grants no access.
        native_id:
          type: string
          nullable: true
          description: >-
            The platform's stable user identifier this grant is bound to.
            Null for a legacy handle-only entry, which grants no access until re-granted.
        requires_regrant:
          type: boolean
          description: True when this legacy entry has no bound native identity and grants no access.
        label: { type: string, description: "A display name, shown beside the handle. Never matched on." }
        granted_at: { type: string, description: "When it was handed over." }
        granted_by: { type: string, description: "Who handed it over." }
        removable:
          type: boolean
          description: Always true here. The shipped entries carry false and cannot be revoked.
      required: [id, adapter, handle, native_id, requires_regrant, removable]

    Administrator:
      type: object
      description: One granted holder of the administrator role, who administers every community.
      properties:
        id: { type: integer, description: "How the revoke route addresses this entry." }
        adapter: { type: string, description: "Which platform the handle belongs to." }
        handle:
          type: string
          description: >-
            The current display handle recorded with the grant. Authorization
            is bound to native_id, so recycling this handle grants no access.
        native_id:
          type: string
          nullable: true
          description: >-
            The platform's stable user identifier this grant is bound to.
            Null for a legacy handle-only entry, which grants no access until re-granted.
        requires_regrant:
          type: boolean
          description: True when this legacy entry has no bound native identity and grants no access.
        label: { type: string, description: "A display name, shown beside the handle. Never matched on." }
        granted_at: { type: string, description: "When it was handed over." }
        granted_by: { type: string, description: "Who handed it over." }
        removable:
          type: boolean
          description: Always true here. The shipped entries carry false and cannot be revoked.
      required: [id, adapter, handle, native_id, requires_regrant, removable]

    BakedInAdministrator:
      type: object
      description: >-
        A handle the deployment ships with, which is the floor under the granted
        entries. It carries no id, because there is nothing to address and
        nothing to revoke.
      properties:
        handle: { type: string, description: "The handle as it is matched." }
        kind:
          type: string
          description: >-
            "username" for a bare handle, "matrix" for a fully qualified
            federated id, or "telegram_id"/"discord_id" for a platform native
            id.
        removable:
          type: boolean
          description: Always false.
      required: [handle, kind, removable]

    AdministratorGrant:
      type: object
      properties:
        adapter:
          type: string
          description: Which platform the handle belongs to.
          example: telegram
        handle:
          type: string
          description: The bare username, or the fully qualified id on a federated platform.
          example: ada
        native_id:
          type: string
          description: >-
            The platform's stable user identifier. Supply it explicitly when the
            handle has no unique identity observed by this deployment. When omitted,
            a unique known handle is resolved; a full Matrix ID or scoped IRC account
            may identify itself. Unknown or ambiguous handles are refused with 422.
          example: "123456789"
        label:
          type: string
          description: An optional display name to show beside the handle.
      required: [adapter, handle]

    BakedInViewer:
      type: object
      description: >-
        A handle the deployment ships with, which is the floor under the granted
        entries. It carries no id, because there is nothing to address and
        nothing to revoke.
      properties:
        handle: { type: string, description: "The handle as it is matched." }
        kind:
          type: string
          description: >-
            "username" for a bare handle, "matrix" for a fully qualified
            federated id, or "telegram_id"/"discord_id" for a platform native
            id.
        removable:
          type: boolean
          description: Always false.
      required: [handle, kind, removable]

    ViewerGrant:
      type: object
      properties:
        adapter:
          type: string
          description: Which platform the handle belongs to.
          example: telegram
        handle:
          type: string
          description: The bare username, or the fully qualified id on a federated platform.
          example: ada
        native_id:
          type: string
          description: >-
            The platform's stable user identifier. Supply it explicitly when the
            handle has no unique identity observed by this deployment. When omitted,
            a unique known handle is resolved; a full Matrix ID or scoped IRC account
            may identify itself. Unknown or ambiguous handles are refused with 422.
          example: "123456789"
        label:
          type: string
          description: An optional display name to show beside the handle.
      required: [adapter, handle]

    ViewerRequest:
      type: object
      description: Somebody's ask to read every community, waiting on an administrator.
      properties:
        id: { type: integer, description: "How the approve and deny routes address it." }
        adapter: { type: string, description: "Which platform it was filed from." }
        requester_username: { type: string, description: "The requester's handle, as it will be matched." }
        requester_display: { type: string, description: "The requester's display name, for reading only." }
        state:
          type: string
          enum: [pending, approved, denied]
          description: Where the request stands.
        requested_at: { type: string, description: "When it was filed." }
        decided_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required: [id, adapter, state, requested_at]

    CommunityViewer:
      type: object
      description: >-
        One holder of the community-scoped viewer dimension, who reads this one
        community and changes nothing in it.
      properties:
        id: { type: integer, description: "How the revoke route addresses this entry." }
        community_id: { type: integer, description: "The community this entry reads." }
        adapter: { type: string, description: "Which platform the handle belongs to." }
        handle:
          type: string
          description: >-
            The current display handle recorded with the grant. Authorization
            is bound to native_id, so recycling this handle grants no access.
        native_id:
          type: string
          nullable: true
          description: >-
            The platform's stable user identifier this grant is bound to.
            Null for a legacy handle-only entry, which grants no access until re-granted.
        requires_regrant:
          type: boolean
          description: True when this legacy entry has no bound native identity and grants no access.
        label: { type: string, description: "A display name, shown beside the handle. Never matched on." }
        granted_at: { type: string, description: "When it was handed over." }
        granted_by: { type: string, description: "Who handed it over." }
        removable:
          type: boolean
          description: Always true here. The shipped entries carry false and cannot be revoked.
      required: [id, community_id, adapter, handle, native_id, requires_regrant, removable]

    CommunityViewerRequest:
      type: object
      description: Somebody's ask to read one community, waiting on an operator of it.
      properties:
        id: { type: integer, description: "How the approve and deny routes address it." }
        community_id: { type: integer, description: "The community the ask is about." }
        adapter: { type: string, description: "Which platform it was filed from." }
        requester_username: { type: string, description: "The requester's handle, as it will be matched." }
        requester_display: { type: string, description: "The requester's display name, for reading only." }
        state:
          type: string
          enum: [pending, approved, denied]
          description: Where the request stands.
        requested_at: { type: string, description: "When it was filed." }
        decided_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required: [id, community_id, adapter, state, requested_at]

    AuthToken:
      type: object
      description: >-
        A token somebody can be handed so they are granted a role by sending it
        to the bot. The token string is absent here and always will be: only its
        digest is kept, so nothing can hand it back.
      properties:
        public_id:
          type: string
          format: uuid
          description: How the revoke route addresses this token. Never the token string.
        community:
          type: string
          nullable: true
          description: The community the role lands in, or null for the deployment wide one.
        grants:
          type: string
          description: What redeeming it hands over, in words.
        label: { type: string, description: "A note shown beside it. Never part of the credential." }
        state:
          type: string
          enum: [live, spent, revoked, expired]
          description: Whether it still works, and if not, why not.
        created_by: { type: string, description: "Who minted it." }
        created_at: { type: string, description: "When it was minted." }
        expires_at: { type: string, description: "When it stops working, whether or not it was used." }
        redeemed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        redeemed_by:
          type: string
          nullable: true
          description: Who spent it, as their handle or their platform id. Null while it is unspent.
        revoked_at:
          $ref: "#/components/schemas/NullableTimestamp"
      required: [public_id, grants, state, created_at, expires_at]

    IssuedAuthToken:
      allOf:
        - $ref: "#/components/schemas/AuthToken"
        - type: object
          properties:
            token:
              type: string
              description: >-
                The token string, answered here and nowhere else, ever. Hand it
                to the person it is for and keep no copy: anybody who has it
                takes the role it carries.
          required: [token]

    CommunityAuthTokenMint:
      type: object
      description: What a token minted for one community carries. At least one of the two roles.
      properties:
        operator:
          type: boolean
          description: >-
            Whether redeeming it makes the holder an operator of this
            community. Needs an administrator key; a developer key is refused.
        viewer:
          type: boolean
          description: Whether redeeming it lets the holder read this community and change nothing in it.
        ttl_seconds:
          type: integer
          description: How long it stays redeemable. Defaults to a day, and a fortnight is the most it may be.
        label:
          type: string
          description: A note about who it is for, so a list of them is readable later.

    DeploymentAuthTokenMint:
      type: object
      description: >-
        What a deployment wide token carries. There is nothing to choose: it
        hands over reading every community and changing nothing anywhere, which
        is the only role that is not scoped to one community.
      properties:
        ttl_seconds:
          type: integer
          description: How long it stays redeemable. Defaults to a day, and a fortnight is the most it may be.
        label:
          type: string
          description: A note about who it is for, so a list of them is readable later.

    Script:
      type: object
      description: One operator-authored script. The compiled output is never returned, only the source as written.
      properties:
        id: { type: integer, description: "The script's id within the community." }
        name:
          type: string
          description: The script's name, unique among the community's live scripts.
        kind:
          type: string
          enum: [processor, command, callback]
          description: >-
            "processor" runs on every message, "command" on a specific /thing,
            and "callback" only when another script invokes it.
        language:
          type: string
          description: One of the names the capabilities route lists for this deployment.
        source: { type: string, description: "The script as it was written, in its own language." }
        yaml_data:
          type: string
          description: >-
            The script's own YAML data file, as the document that was written
            rather than as the parser's reading of it, and an empty string when
            it has none. A script reads it with rubotty.yaml_data() and cannot
            write it.
        condition:
          type: string
          description: >-
            The trigger condition, named separately from the kind. One of the
            condition names the capabilities route lists.
        trigger_config:
          type: object
          additionalProperties: true
          description: The fields that condition takes, as the capabilities route lists them.
        enabled:
          type: boolean
          description: Whether it is actually running on live traffic right now.
        checked:
          type: boolean
          description: Whether it has compiled and passed its smoke test since it was last edited.
        archived:
          type: boolean
          description: Whether the script has been moved aside. An archived one never runs.
        disabled_reason:
          type: string
          description: Why it was turned off, or an empty string.
        community:
          type: string
          description: The owning community's slug.
      required:
        [id, name, kind, language, source, yaml_data, condition, trigger_config, enabled, checked,
         archived, disabled_reason, community]

    ScriptWriteBody:
      type: object
      description: >-
        On a create, `name` and `source` are needed and the rest take
        defaults (kind "processor", language "lua", condition "always"). On an
        edit, every field is optional and anything left out keeps its current
        value.
      properties:
        name:
          type: string
          description: The script's name, unique among the community's live scripts.
        kind:
          type: string
          enum: [processor, command, callback]
          description: What invokes it. Defaults to processor.
        language:
          type: string
          description: The source language, one the capabilities route lists. Defaults to lua.
        source:
          type: string
          description: The script itself. Refused when it will not compile.
        yaml_data:
          type: string
          description: >-
            The script's YAML data file. Parsed here, so a document that will
            not parse is refused with a 422 instead of reaching the script. It
            has to be a set of keys or a list, and it is capped at the size the
            capabilities route reports.
        trigger_type:
          type: string
          description: >-
            The trigger condition. Named `trigger_type` on the way in and
            `condition` on the way out.
        trigger_config:
          type: object
          additionalProperties: true
          description: The fields the chosen condition takes, as the capabilities route lists them.

    ScriptVerification:
      type: object
      properties:
        ok: { type: boolean, description: "Whether the script compiled and passed its smoke test." }
        problems:
          description: >-
            An empty list when it passed, and the collected reasons as one
            string when it did not.
          oneOf:
            - type: array
              items: { type: string }
            - type: string
      required: [ok, problems]

    ScriptEndpoint:
      type: object
      description: >-
        One named outbound address a script may call. Headers are the one field
        never echoed back, since an endpoint carries an API key that nothing
        downstream may read; only `has_headers` is reported.
      properties:
        id: { type: integer, description: "The endpoint's id within the community." }
        name: { type: string, description: "The name a script calls this endpoint by." }
        url: { type: string, description: "Where the call goes." }
        http_method: { type: string, enum: [GET, POST], description: "Which verb the call uses." }
        description:
          type: string
          description: What this endpoint is for, for whoever reads the list.
        allow_sync:
          type: boolean
          deprecated: true
          description: >-
            Deprecated and inert. Every endpoint call is fire and forget, so
            this decides nothing. Still stored and still returned so an
            existing client keeps working; it will be removed in a later
            version.
        enabled: { type: boolean, description: "Whether a script may call it at all." }
        timeout_seconds:
          type: integer
          description: How long a call may take before it is abandoned. Capped at 30.
        cache_seconds:
          type: integer
          deprecated: true
          description: >-
            Deprecated and inert. Nothing caches an endpoint answer any more.
            Still stored and still returned so an existing client keeps
            working; it will be removed in a later version.
        query_params:
          type: string
          description: >-
            Query parameters as text, one "name: value" pair per line.
        has_headers:
          type: boolean
          description: Whether any request header is configured. The header values themselves are never returned.
      required:
        [id, name, url, http_method, description, allow_sync, enabled, timeout_seconds,
         cache_seconds, query_params, has_headers]

    Webhook:
      type: object
      description: >-
        A standing instruction to forward this community's events to an
        address. The signing secret is returned on creation and on rotation
        only, never here.
      properties:
        public_id:
          type: string
          description: How every other call addresses this subscription.
        url: { type: string, description: "Where deliveries are sent. Always https." }
        label:
          type: string
          description: What this subscription is for, for whoever reads the list.
        event_types:
          type: array
          items: { type: string }
          description: Which events this address is sent.
        room_key:
          type: string
          description: One room, or empty for every room in the community.
        active:
          type: boolean
          description: Nothing is queued for an inactive subscription.
        rotating:
          type: boolean
          description: >-
            Whether a rotation overlap is still open, meaning deliveries are
            currently being signed with two secrets.
        created_at: { type: string, description: "When the subscription was made." }
      required: [public_id, url, label, event_types, room_key, active, rotating, created_at]

    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          properties:
            secret:
              type: string
              description: >-
                The signing key, in the Standard Webhooks `whsec_` format. The
                HMAC key is the base64-decoded portion after that prefix.
          required: [secret]

    WebhookDelivery:
      type: object
      description: One event's journey to one subscriber.
      properties:
        id: { type: integer, description: "The delivery attempt record's id." }
        event_id:
          type: string
          description: The value sent as the `webhook-id` header, and the deduplication key.
        event_type: { type: string, description: "Which event this delivery carries." }
        room_key:
          type: string
          description: The room the event came from. Empty when it came from no room.
        status:
          type: string
          enum: [queued, delivered, failed]
          description: Where the delivery stands.
        attempts: { type: integer, description: "How many times sending has been tried." }
        response_status:
          type: integer
          nullable: true
          description: What the subscriber answered, or null when nothing answered at all.
        last_error:
          type: string
          description: Empty on a delivery that landed.
        created_at: { type: string, description: "When the delivery was queued." }
        delivered_at:
          type: string
          description: When it landed. Empty until it does.
      required:
        [id, event_id, event_type, room_key, status, attempts, response_status,
         last_error, created_at, delivered_at]

    WebhookWriteBody:
      type: object
      description: >-
        `url` has to be https. `event_types` is a list, or a comma-separated
        string when the body is form-encoded.
      properties:
        url: { type: string, description: "Where deliveries are sent. Has to be https." }
        event_types:
          description: Which events to send. An unknown one is refused here, which is the only point it is checked.
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        room_key:
          type: string
          description: Narrow to one room. Omitted, every room in the community is sent.
        label: { type: string, description: "What this subscription is for. Optional." }
      required: [url, event_types]

    WebhookRotateBody:
      type: object
      properties:
        overlap:
          type: integer
          description: >-
            Seconds the outgoing secret keeps working. Defaults to 86400. Zero
            retires it at once.
      required: []

    ScriptEndpointWriteBody:
      type: object
      description: >-
        On a create, `name` and `url` are needed and the rest take defaults
        (GET, enabled, a 2 second timeout and a 30 second cache). On an edit,
        every field is optional and anything left out keeps its current value.
      properties:
        name: { type: string, description: "The name a script will call this endpoint by." }
        url: { type: string, description: "Where the call goes." }
        http_method:
          type: string
          enum: [GET, POST]
          description: Which verb the call uses. Defaults to GET.
        description: { type: string, description: "What this endpoint is for. Optional." }
        headers:
          description: >-
            Request headers, either as a mapping or as text with one
            "Name: value" per line. Write only: never returned.
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: string
        query_params:
          description: >-
            Query parameters, either as a mapping or as text with one
            "name: value" per line.
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: string
        allow_sync:
          type: boolean
          deprecated: true
          description: Deprecated and inert. Accepted and stored, but it decides nothing.
        enabled:
          type: boolean
          description: Whether a script may call it at all. Defaults to true.
        timeout_seconds:
          type: integer
          maximum: 30
          description: How long a call may take before it is abandoned. Defaults to 2.
        cache_seconds:
          type: integer
          maximum: 86400
          deprecated: true
          description: Deprecated and inert. Accepted and stored, but nothing caches an answer.

    IntegrationWriteBody:
      type: object
      description: >-
        Every field is optional and anything left out keeps its current
        value. A blank or omitted api_key leaves whatever key is already
        stored untouched, like a password field left blank; there is no way
        to clear it through this body, only replace it.
      properties:
        url:
          type: string
          description: The connection's endpoint. Must be an http or https address.
        api_key:
          type: string
          description: Blank or omitted leaves whatever key is already stored untouched.
        config:
          type: object
          additionalProperties: true
          description: Whatever else this integration needs, e.g. openarc's model.

    IrcNetworkWriteBody:
      type: object
      description: >-
        On a create, `name`, `host` and `nick` are needed and the rest take
        defaults (port 6697, tls, per_room mode). On an edit, every field is
        optional and anything left out keeps its current value. `hub_channel`
        is required, and only used, when mode is hub; it is cleared for a
        per_room network regardless of what is sent.
      properties:
        name: { type: string, description: "A short, community-chosen handle for this network." }
        host: { type: string, description: "The network's wire hostname." }
        port: { type: integer, description: "Defaults to 6697." }
        tls: { type: boolean, description: "Defaults to true." }
        nick: { type: string, description: "The nickname the bot connects under." }
        sasl_user: { type: string, description: "SASL account name (PLAIN mechanism). Optional." }
        sasl_password_env:
          type: string
          description: The NAME of the environment variable holding the SASL password, never the password.
        channels:
          type: array
          items: { type: string }
          description: Channel names to join on connect.
        mode:
          type: string
          enum: [per_room, hub]
          description: Defaults to per_room.
        hub_channel: { type: string, description: "Required, and only used, when mode is hub." }
        channel_keys:
          type: object
          additionalProperties: { type: string }
          description: >-
            Channel name to the NAME of the environment variable holding
            that channel's +k key, never the raw key.

    ScriptStats:
      type: object
      description: >-
        Counter name to its rows, each row ordered by value, largest first. An
        empty mapping means no script has recorded anything within the
        retention window.
      additionalProperties:
        type: array
        items:
          type: object
          properties:
            row: { type: string, description: "The row name the script chose." }
            value: { type: integer, description: "What the counter stands at." }
            room_key:
              type: string
              description: Where it was counted. Empty when it belongs to no room.
          required: [row, value, room_key]

    ScriptingCapabilities:
      type: object
      description: What this deployment can compile and what it will allow, which differs between deployments.
      properties:
        kinds:
          type: array
          description: The script kinds this deployment runs.
          items:
            type: object
            properties:
              kind: { type: string, description: "The value to send as a script's kind." }
              label: { type: string, description: "What that kind does, in one line." }
            required: [kind, label]
        conditions:
          type: array
          description: The trigger conditions a script may be woken by.
          items:
            type: object
            properties:
              condition:
                type: string
                description: The value to send as a script's trigger_type.
              summary: { type: string, description: "When this condition fires, in one line." }
              fields:
                type: array
                items: { type: string }
                description: The names of the fields this condition's trigger_config takes.
              hands_over:
                type: array
                items: { type: string }
                description: What the condition makes available to the script when it fires.
            required: [condition, summary, fields, hands_over]
        languages:
          type: array
          items: { type: string }
          description: >-
            The source languages installed here. Shorter than the full set when
            a transpiler is missing from the host.
        limits:
          type: object
          description: What this deployment allows, enforced on every write and every run.
          properties:
            scripts_per_community:
              type: integer
              description: How many live scripts one community may hold.
            host_calls_per_invocation:
              type: integer
              description: How many host calls one script run may make.
            yaml_data_bytes:
              type: integer
              description: The largest data file a script may carry.
          required: [scripts_per_community, host_calls_per_invocation, yaml_data_bytes]
      required: [kinds, conditions, languages, limits]

    ProcessInfo:
      type: object
      description: >-
        For a bot source, `reachable` reports whether the internal hop
        succeeded. When it is false, `error` explains why and the build fields
        are absent.
      properties:
        version: { type: string, description: "The release this process is running." }
        commit: { type: string, description: "The commit that release was built from." }
        hostname: { type: string, description: "The host the process is on." }
        runtime: { type: string, description: "The interpreter and its version." }
        platform: { type: string, description: "The architecture and operating system." }
        pid: { type: integer, description: "The process id." }
        healthy:
          type: boolean
          description: Whether the process considers itself in working order.
        reachable:
          type: boolean
          description: Bot only. Whether the internal hop to it succeeded.
        error: { type: string, description: "Why an unreachable process could not be asked." }
        scripting:
          $ref: "#/components/schemas/ScriptingInfo"
        stranded_endpoints:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Bot only. Endpoint id to how many of its messages have been
            discarded for belonging to no room. A non-empty map means those
            channels are silently swallowing everything sent to them and need
            mapping.
      additionalProperties: true

    ScriptingInfo:
      type: object
      description: What the script toolchain on this host looks like, and why a language may be missing from it.
      properties:
        interpreter:
          type: string
          description: The interpreter found on PATH, or "none on PATH".
        searched:
          type: array
          items: { type: string }
          description: >-
            The directories actually searched, which is wider than PATH alone.
            A transpiler that installed and still cannot be found is a question
            about this list.
        dialects:
          type: object
          additionalProperties: { type: string }
          description: >-
            Each language to either "built in" or the binary it wants and
            whether that binary was found.
      required: [interpreter, searched, dialects]

    LogEntry:
      type: object
      description: The one place a timestamp is UTC ISO 8601 rather than the wall-clock form used elsewhere.
      properties:
        source: { type: string, enum: [web, bot], description: "Which process wrote the line." }
        time:
          type: string
          nullable: true
          description: When it was written, UTC ISO 8601, or null when the line carried none.
        level:
          type: string
          nullable: true
          description: The line's severity, or null when it carried none.
        text: { type: string, description: "The line itself." }
      required: [source, text]

    BackfillGapChannel:
      type: object
      description: >-
        One swept channel's tally, worst (most gaps) first. Never carries a
        message body: a sample names only the source endpoint, the platform's
        own message id and its timestamp.
      properties:
        endpoint_id: { type: string, description: "Which channel this row covers." }
        community: { type: string, description: "The community's slug." }
        since:
          type: string
          nullable: true
          description: Where the sweep's window starts, UTC ISO 8601.
        fetched: { type: integer, description: "How many candidate messages the platform returned." }
        gaps: { type: integer, description: "Candidates nothing has ever accounted for." }
        ours: { type: integer, description: "This bridge's own relayed copies, arriving from the far side." }
        claimed: { type: integer, description: "Candidates the relay ledger already has a claim against." }
        below_floor: { type: integer, description: "Candidates older than the safe horizon, never counted as a gap." }
        samples:
          type: array
          items:
            $ref: "#/components/schemas/BackfillGapFinding"
          description: A bounded sample of gap ids, enough to look at one by hand.
        error:
          type: string
          nullable: true
          description: Set instead of a tally when sweeping this channel itself failed.
      required: [endpoint_id, community, fetched, gaps, ours, claimed, below_floor, samples]

    BackfillProposal:
      type: object
      description: >-
        One channel's held-back list and where its decision stands. The counts
        are what the sweep itself saw, not a recount taken later, which is
        what makes them safe to judge by.
      properties:
        id: { type: integer, description: "Which proposal to act on." }
        community:
          type: string
          nullable: true
          description: The slug of the community whose channel this covers.
        endpoint_id: { type: string, description: "Which channel the sweep found the gap on." }
        status:
          type: string
          enum: [pending, approved, rejected, expired, relayed]
          description: >-
            Waiting on a decision, accepted and waiting to be sent, refused,
            out of time, or sent.
        fetched: { type: integer, description: "How many candidate messages the platform returned." }
        gaps: { type: integer, description: "How many would be sent if this is accepted." }
        ours:
          type: integer
          description: >-
            How many of the fetched messages the sweep recognised as this
            bridge's own relayed copies and skipped. Read this first: a zero
            on a channel that has bridged for months means the ownership check
            is not working, and accepting would push those copies back into a
            live room.
        claimed: { type: integer, description: "Candidates the relay ledger already has a claim against." }
        below_floor: { type: integer, description: "Candidates older than the safe horizon, never counted as a gap." }
        swept_since:
          type: string
          nullable: true
          description: Where the sweep's window starts, or null when it had no start.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        decided_by:
          type: string
          nullable: true
          description: Who accepted or refused it, or null while it is still waiting.
        decided_at:
          $ref: "#/components/schemas/NullableTimestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      required: [id, endpoint_id, status, fetched, gaps, ours, claimed, below_floor, expires_at, created_at]

    BackfillProposalDetail:
      type: object
      description: >-
        One proposal, and the messages it would send if accepted. The previews
        are kept only while the proposal still needs them, so a settled one
        carries counts and no text.
      properties:
        backfill_proposal:
          $ref: "#/components/schemas/BackfillProposal"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackfillProposalItem"
          description: The stored list, oldest first, which is the order a replay goes out in.
        items_pruned:
          type: boolean
          description: >-
            Whether the previews have been deleted. True means the list is
            empty because there is nothing left to read, not because the sweep
            was going to send nothing.
        items_note:
          type: string
          description: Present only when the previews are gone, saying what happened to them.
      required: [backfill_proposal, items, items_pruned]

    BackfillProposalItem:
      type: object
      description: >-
        One message the sweep would relay. The preview is enough to recognise
        it when deciding, cut well short of the whole body, and it is deleted
        with the decision.
      properties:
        native_id: { type: string, description: "The platform's own id for the message, on the side it came from." }
        author_label:
          type: string
          nullable: true
          description: Who said it, as a display label. Never used to authorise anything.
        preview:
          type: string
          nullable: true
          description: The start of the message, cut to 500 characters.
        sent_at:
          type: string
          nullable: true
          description: When the platform says it was sent.
      required: [native_id]

    BackfillGapFinding:
      type: object
      description: One candidate classified as a gap. No message body, only enough to find it again.
      properties:
        endpoint_id: { type: string, description: "The channel it was found on." }
        native_id: { type: string, description: "The platform's own id for the message." }
        timestamp:
          type: string
          nullable: true
          description: When the platform says it was sent, UTC ISO 8601.
      required: [endpoint_id, native_id]

    Stats:
      type: object
      description: >-
        The window it covers, plus one sub-object each for moderation, members,
        messages, reactions, guests, warnings, sanctions, events, multiposts,
        onboarding and operator requests. The nested counts are left
        unmodelled. A sub-object carrying `available: false` means that
        aggregate needs a feature this deployment does not have turned on.
      properties:
        window:
          type: string
          description: The window width, for example "7d".
        since:
          $ref: "#/components/schemas/Timestamp"
        now:
          $ref: "#/components/schemas/Timestamp"
      required: [window, since, now]
      additionalProperties: true

    Alert:
      type: object
      description: One thing a script raised for this community's operators.
      properties:
        id: { type: integer, description: "The alert's id within the community." }
        text:
          type: string
          description: >-
            What the script said, capped and with its whitespace collapsed. A
            script can build this out of a message it was handed, so it is
            bounded at the point it is written down.
        mode:
          type: string
          enum: [quiet, loud]
          description: >-
            "quiet" was recorded and shown. "loud" also messaged the operators
            directly.
        delivered_to:
          type: integer
          description: >-
            How many operators a loud alert actually reached. Zero usually
            means the community's operators are only reachable somewhere the
            bot cannot open a direct message.
        room_key:
          type: string
          description: Where it was raised. Empty for a script woken on a schedule, which has no room.
        script:
          type: string
          description: >-
            The name of the script that raised it. Deleting a script does not
            take its alerts with it.
        seen_at:
          $ref: "#/components/schemas/NullableTimestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      required: [id, text, mode, delivered_to, room_key, script, created_at]

    ParticipationSession:
      type: object
      nullable: true
      description: >-
        The one open session in a room, exactly as a script's own session()
        call sees it, or null when nothing is running there. Rubotty holds no
        list of what a session may be called, so kind is whatever the script
        that opened it chose.
      properties:
        kind:
          type: string
          description: What the script calls the game, for example trivia or poll.
        label:
          type: string
          description: The session's own title, or empty when none was given.
        state:
          type: string
          enum: [open]
          description: Always "open". A closed session is never returned by this route.
        opened_at:
          type: integer
          description: >-
            When the session was opened, as a Unix timestamp, the same shape
            a script is handed.
        rounds:
          type: integer
          description: How many rounds have run in this session so far.
      required: [kind, label, state, opened_at, rounds]

    ParticipationRound:
      type: object
      nullable: true
      description: >-
        The one open round in a room, exactly as a script's own round() call
        sees it, or null when none is open. Rubotty holds a bounded interval
        with a deadline, a continuation and a payload here, and nothing about
        what the round is for: a prompt, an answer, a vote tally, whatever it
        is lives in data, entirely a script's own business.
      properties:
        id:
          type: integer
          description: This round's own id, stable for the bucket a script keeps against it.
        position:
          type: integer
          description: Which round this is within the session, starting at 1.
        opened_at:
          type: integer
          description: When the round was opened, as a Unix timestamp.
        closes_at:
          type: integer
          description: >-
            When the round's own close is booked to fire, as a Unix
            timestamp. Absent unless open_round's close_after named one.
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Whatever the script gave open_round, or close_round replaced it
            with. Opaque to rubotty: shape and presence are entirely up to
            the script that opened the round.
      required: [id, position, opened_at]

    ScriptError:
      type: object
      description: One failure, truncated at the point it was recorded.
      properties:
        at: { type: string, description: "When the failure happened." }
        message: { type: string, description: "What went wrong, truncated where it was recorded." }
      required: [at, message]

    ScriptErrors:
      type: object
      description: >-
        A script's failure record. Everything is empty or zero for one that has
        never failed on live traffic, which is the healthy answer rather than a
        404.
      properties:
        id: { type: integer, description: "The script this record belongs to." }
        name: { type: string, description: "That script's name." }
        consecutive_failures:
          type: integer
          description: >-
            Reset to zero by a clean run, so this counts a current streak rather
            than a lifetime total.
        disabled_at:
          $ref: "#/components/schemas/NullableTimestamp"
        disabled_reason:
          type: string
          description: Why the repeated-failure cutout switched it off, or an empty string.
        last_error:
          type: string
          description: The most recent failure's text, or an empty string.
        last_error_at:
          $ref: "#/components/schemas/NullableTimestamp"
        errors:
          type: array
          description: A short ring of recent failures, newest first. It survives an edit.
          items:
            $ref: "#/components/schemas/ScriptError"
      required: [id, name, consecutive_failures, disabled_reason, last_error, errors]

    File:
      type: object
      description: >-
        A file this deployment is holding. Carries no UUID and no download
        link, since neither is recoverable from what is stored.
      properties:
        id:
          type: integer
          description: How a listing names this file, since its UUID cannot be listed.
        filename: { type: string, description: "The name recorded for the file." }
        content_type:
          type: string
          description: The media type recorded for it. Stored as given, never sniffed.
        byte_size:
          type: integer
          description: The file's real size, before it was compressed and encrypted.
        sealed_bytes:
          type: integer
          description: What the disk is actually carrying, which is normally smaller.
        room_key:
          type: string
          description: The room it belongs to, or an empty string.
        source:
          type: string
          enum: [relay, upload]
          description: >-
            "relay" for a file the bridge could not deliver to a platform, so it
            posted a link instead. "upload" for one somebody handed over.
        created_by:
          type: string
          description: Who it came from, as a label. Never used to authorise anything.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      required: [id, filename, content_type, byte_size, sealed_bytes, source, created_at, expires_at]

    FileWithLink:
      allOf:
        - $ref: "#/components/schemas/File"
        - type: object
          description: >-
            The upload and the rotation are the only responses carrying these
            two. The UUID is not stored and cannot be asked for again.
          properties:
            uuid:
              type: string
              format: uuid
              description: >-
                The secret naming the file. It is both the capability to
                download it and the key it is encrypted under, so anybody
                holding it can read the file and nobody else can.
            url:
              type: string
              description: >-
                The download address: this deployment's public base, followed
                by the UUID and a real file extension for whatever was
                uploaded. With no public base configured, only the path comes
                back.
          required: [uuid, url]

    FileSecretBody:
      type: object
      required: [uuid]
      properties:
        uuid:
          type: string
          format: uuid
          description: >-
            The UUID naming the file. An absent one is refused rather than read
            as "no such file".
