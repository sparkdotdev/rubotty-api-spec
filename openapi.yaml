        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/webhooks/{public_id}/rotate:
    post:
      operationId: rotateWebhookSecretAdmin
      summary: Replace the signing secret, with an overlap
      description: >-
        Mints a new signing secret and returns it. Until the overlap
        lapses every delivery is signed with both the new secret and the
        old one, and carries both in the one space-delimited
        `webhook-signature` header the Standard Webhooks format defines
        for this, so the receiving end keeps verifying with the old
        secret until the new one is deployed.

        An overlap of 0 retires the old secret immediately, which is
        what a leaked secret calls for.
      tags: [Webhooks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/publicId"
      requestBody:
        $ref: "#/components/requestBodies/WebhookRotate"
      responses:
        "200":
          $ref: "#/components/responses/WebhookCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/webhook-deliveries:
    get:
      operationId: listWebhookDeliveriesAdmin
      summary: What happened to every attempt at sending
      description: >-
        One row per event per subscription, newest first, with the
        response code or the error behind each one. A `queued` delivery
        has attempts left and is waiting out a backoff. A `failed` one
        has exhausted them and is not tried again.
      tags: [Webhooks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, delivered, failed] }
          description: Narrow to one outcome. Omitted, every delivery is listed.
        - name: webhook
          in: query
          required: false
          schema: { type: string }
          description: Narrow to one subscription, by its public id.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
          description: How many attempts to return, newest first.
      responses:
        "200":
          description: The matching deliveries.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

