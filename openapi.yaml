  /communities/{slug}/content-policy/misfires:
    get:
      operationId: listContentPolicyMisfires
      summary: Read the content policy actions an operator reversed
      description: >-
        One row per mistake an operator named, newest first: an action undone
        with /vindicate, or a message /condemn said the policies should have
        caught. Each carries the text, the model's own reasoning and
        confidence, and the operator's stated reason, which together are what a
        policy description gets rewritten against. Read kind to tell the two
        apart. No author is recorded: the corpus is about the text and the
        judgement.
      tags: [Content policy]
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: limit
          in: query
          required: false
          description: How many to return, from 1 to 500. Defaults to 100.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          $ref: "#/components/responses/ContentPolicyMisfires"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

