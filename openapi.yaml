        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/irc-networks:
    post:
      operationId: createIrcNetworkAdmin
      summary: Create an IRC network
      description: >-
        Creating, editing or removing an IRC network is closer to
        provisioning than to day-to-day moderation, so this and the two
        routes below need an administrator key; the plain read routes above
        stay open to a developer key.
      tags: [IRC networks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/IrcNetworkWrite"
      responses:
        "201":
          $ref: "#/components/responses/IrcNetwork"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/irc-networks/{name}:
    patch:
      operationId: updateIrcNetworkAdmin
      summary: Edit an IRC network
      description: A partial update. Anything the body leaves out keeps the value the network already had.
      tags: [IRC networks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: libera
          description: Which IRC network to edit, by the name the community gave it.
      requestBody:
        $ref: "#/components/requestBodies/IrcNetworkWrite"
      responses:
        "200":
          $ref: "#/components/responses/IrcNetwork"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteIrcNetworkAdmin
      summary: Remove an IRC network
      tags: [IRC networks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: libera
          description: Which IRC network to remove, by the name the community gave it.
      responses:
        "204":
          description: The IRC network was removed. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/fluxer-instances:
    get:
      operationId: listFluxerInstances
      summary: List the community's Fluxer instances
      tags: [Fluxer instances]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Every Fluxer instance in the community.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  fluxer_instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/FluxerInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/fluxer-instances/{label}:
    get:
      operationId: getFluxerInstance
      summary: Read a single Fluxer instance by label
      tags: [Fluxer instances]
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: label
          in: path
          required: true
          schema: { type: string }
          description: Which Fluxer instance to read, by the label the community gave it.
      responses:
        "200":
          description: The Fluxer instance.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/FluxerInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # guest invites and events
  # ------------------------------------------------------------------
  /communities/{slug}/guest-invites:
    get:
      operationId: listGuestInvites
      summary: List the community's guest invites
      description: >-
        Never carries a token. Only a token's digest is ever stored; the raw
        token is shown to the inviter once, at issuance, and is not readable
        back from anywhere.
      tags: [Guest invites]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Every guest invite in the community.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  guest_invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/GuestInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/guest-invites/{id}:
    get:
      operationId: getGuestInvite
      summary: Read a single guest invite
      tags: [Guest invites]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The guest invite.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/GuestInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/rooms/{room_key}/events:
    get:
      operationId: listRoomEvents
      summary: List a room's upcoming scheduled events
      description: >-
        Only what is upcoming and not cancelled, the same "what is coming up"
        view the dashboard's events page shows, rather than the full history.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      responses:
        "200":
          description: The room's upcoming events.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createRoomEvent
      summary: Schedule an event in a room
      description: >-
        Creates an event in this room. A developer key may write only its own
        community. The room must have events enabled.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      requestBody:
        $ref: "#/components/requestBodies/EventCreate"
      responses:
        "201":
          $ref: "#/components/responses/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/events/{id}:
    get:
      operationId: getEvent
      summary: Read a single event by id, whatever its status
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The event.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateEvent
      summary: Edit an event
      description: >-
        A partial update. Leaving a field out keeps its current value; sending
        null for an optional end, description, time zone or URL clears it.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      requestBody:
        $ref: "#/components/requestBodies/EventUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: cancelEvent
      summary: Cancel an event
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # alerts: what a community's scripts raised for its operators.
  # reachable with a developer key, unlike the scripting routes below: an
  # alert is a sentence about this community's own traffic and the name of
  # what raised it, never a script's source or the hosts it may call.
  # ------------------------------------------------------------------
  /communities/{slug}/alerts:
    get:
      operationId: listAlerts
      summary: A community's alerts, newest first
      description: >-
        What this community's scripts raised, each with the marker
        saying whether anybody has looked at it. An alert older than the
        retention window is absent whether or not a housekeeping pass
        has run.

        `unseen` counts what is still outstanding across the whole
        window rather than within the page returned.
      tags: [Alerts]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/alertLimit"
      responses:
        "200":
          description: The alerts, and how many are still unseen.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  unseen: { type: integer }
                required: [alerts, unseen]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/alerts/{id}/seen:
    post:
      operationId: markAlertSeen
      summary: Mark one alert seen
      description: >-
        Answers with the alert, so the marker just set is visible
        without a second call. Marking one that was already seen keeps
        its original timestamp and still answers 200.
      tags: [Alerts]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The alert, now marked seen.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/alerts/seen:
    post:
      operationId: markAllAlertsSeen
      summary: Mark the whole outstanding backlog seen
      description: >-
        For the client coming back to a backlog it has already dealt with
        somewhere else. Answers with how many alerts changed, which is zero when
        there was nothing outstanding.
      tags: [Alerts]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: How many alerts were marked.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  marked: { type: integer }
                required: [marked]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # room games: the session and round behind a script's trivia, poll or Q&A.
  # Developer reachable, the same reasoning as alerts above. Rubotty holds
  # the session and its rounds and nothing about what either is for; a
  # script keeps its own scoreboard in a bucket through add and entries.
  # ------------------------------------------------------------------
  /communities/{slug}/rooms/{room_key}/participation:
    get:
      operationId: getRoomParticipation
      summary: Read a room's open session and round
      description: >-
        `session` is null when nothing is running in the room, the same
        answer a script's own `session()` call gets. `round` is null when no
        round is open inside it, the same answer `round()` gets.
      tags: [Room games]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      responses:
        "200":
          description: The room's open session, or none, and its open round, or none.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/ParticipationSession"
                  round:
                    $ref: "#/components/schemas/ParticipationRound"
                required: [session, round]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/rooms/{room_key}/participation/close:
    post:
      operationId: closeRoomParticipation
      summary: Close a room's open session
      description: >-
        Closes the session and whatever round is open inside it, the same
        call a script's own `close_session()` makes. Refused with 422 when
        nothing is running in the room.
      tags: [Room games]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      responses:
        "200":
          description: The session is closed.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  closed: { type: boolean }
                required: [closed]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # structural room and community administration
  # ------------------------------------------------------------------
  /admin/communities/{slug}/rooms:
    post:
      operationId: requestRoomCreateAdmin
      summary: Request a room on one or more platforms
      description: >-
        Queues creation for the running bot. The acknowledgement does not mean
        the platform channels exist yet; list the community's rooms after the
        bot has completed the request.
      tags: [Room provisioning, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/RoomCreate"
      responses:
        "202":
          $ref: "#/components/responses/RoomProvisioningRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/rooms/{room_key}:
    delete:
      operationId: requestRoomDeleteAdmin
      summary: Request deletion of a room
      description: >-
        Queues removal for the running bot. The confirmation must match the
        room's label or key. Platform channels are only deleted when requested;
        a channel not created by the bot needs its endpoint key named explicitly.
      tags: [Room provisioning, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      requestBody:
        $ref: "#/components/requestBodies/RoomDelete"
      responses:
        "202":
          $ref: "#/components/responses/RoomProvisioningRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/status:
    put:
      operationId: setCommunityStatusAdmin
      summary: Start or suspend a community
      description: >-
        Sets the desired running state. Repeating the current state is a safe
        no-op and returns the community as it stands.
      tags: [Communities, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/CommunityStatus"
      responses:
        "200":
          $ref: "#/components/responses/Community"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/mutes:
    get:
      operationId: listMutesAdmin
      summary: List active manual mutes
      tags: [Moderation, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          $ref: "#/components/responses/Mutes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createMuteAdmin
      summary: Mute a platform user
      description: >-
        The mute is recorded immediately. A duration uses seconds or a compact
        value such as `30m`, `1h` or `1d`; omit it for an indefinite mute.
      tags: [Moderation, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/MuteCreate"
      responses:
        "201":
          $ref: "#/components/responses/Mute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/mutes/{id}:
    delete:
      operationId: deleteMuteAdmin
      summary: Lift an active mute
      tags: [Moderation, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/Mute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # scripts, the endpoints they call, and the numbers they record.
  # administrator only, all of it: a script is code this deployment runs and
  # an endpoint decides which hosts it reaches, so neither is a developer
  # key's business even within its own community.
  # ------------------------------------------------------------------
  /admin/communities/{slug}/scripts:
    get:
      operationId: listScriptsAdmin
      summary: List a community's live scripts
      description: The archive is a separate path, so an ordinary listing never mixes the two.
      tags: [Scripts, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          $ref: "#/components/responses/Scripts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createScriptAdmin
      summary: Create a script
      description: >-
        A new script arrives disabled and unverified. Enabling it is a separate
        call, so nothing an author is still editing can start running on live
        traffic by accident.
      tags: [Scripts, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/ScriptWrite"
      responses:
        "201":
          $ref: "#/components/responses/Script"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/scripts/archived:
    get:
      operationId: listArchivedScriptsAdmin
      summary: List a community's archived scripts
      description: What DELETE moved aside. An archived script can be restored.
      tags: [Scripts, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          $ref: "#/components/responses/Scripts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/scripts/{id}:
    get:
      operationId: getScriptAdmin
      summary: Read a single script
      tags: [Scripts, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/Script"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateScriptAdmin
