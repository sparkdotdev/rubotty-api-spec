  /admin/communities/{slug}/script-stats:
    get:
      operationId: getScriptStatsAdmin
      summary: The numbers scripts recorded
      description: >-
        Read only over the API: recording a counter is something a
        script does. Each key is a counter a script named, and its rows
        are ordered by value, largest first.
      tags: [Scripts, Admin]
