# The REST admin API's contract.
#
# Adding a route means adding it here in the same change: the service's suite
# compares this file against the running route table in both directions, then
# drives every documented operation and validates the real response body
# against the schema written for it.
#
# Everything here describes what a client sees on the wire. No storage names,
# no module paths, no internal references.
openapi: 3.0.3
info:
  title: rubotty admin API
  version: 0.8.0
  description: >-
    The REST admin API for rubotty, a multi-tenant chat-bridge and
    community-moderation platform.


    Every response is `application/yaml`. A request body is either standard
    form-encoding or `application/yaml`. Two exceptions: the liveness probe
    answers plain text, and the room stream answers `text/event-stream` whose
    frames each carry a YAML document.


    Non-multipart request bodies have a 4 MiB (4,194,304 byte) limit. Both
    declared Content-Length and bytes read from the request stream are checked;
    missing or understated length does not allow a larger parsed body. An
    oversized request returns 413 with the usual YAML error mapping. Multipart
    file uploads use a policy-derived limit instead, as described on that route.


    A bearer API key authenticates every route but the liveness probe. A
    `developer` key is confined to a single community. An `administrator` key
    is global. Every route a developer key can never reach, whichever community
    it names, lives under `/admin/`.


    A developer key calling an `/admin/` route gets 403, which confirms nothing
    about whether any particular resource exists. A developer key naming
    another community's resource gets 404, never 403, so it cannot learn that
    the resource is real.


    The version is the service release this contract was written against.
  # The specification uses this repository's unchanged PolyForm Strict licence.
  license:
    name: PolyForm Strict License 1.0.0
    url: https://polyformproject.org/licenses/strict/1.0.0
servers:
  - url: https://rubotty.example.org/api
    description: Production (mounted under the unified web surface)

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Unauthenticated liveness.
  - name: Communities
    description: The tenant a developer key is scoped to, or every tenant for an administrator key.
  - name: Rooms
    description: The set of channels that mirror each other. Most other resources are scoped by room.
  - name: Room provisioning
    description: Creating or removing the platform channels behind a room. Administrator only.
  - name: Messaging
    description: Posting into a room and watching one live.
  - name: Bridge
    description: >-
      A remote system bridged in as a first party platform: posting a
      message, editing or deleting one, and adding or removing a reaction,
      each carrying its own real author. Reachable only with an API key
      scoped to one platform integration.
  - name: Channels
    description: One platform endpoint (a Telegram supergroup, a Discord channel, and so on) bridged into a room.
  - name: People
    description: The passively observed cross-platform identity directory.
  - name: Operators
    description: Who may moderate a community, and pending requests to become one.
  - name: Discovery
    description: >-
      Channels rubotty has found that are not yet mapped into a room, and
      channels a non-operator named that are waiting on a decision.
  - name: Onboarding
    description: Spaces the bot was added to that no community owns yet, and the decisions taken on them. Administrator only.
  - name: Features
    description: Per-community and per-room feature toggles and their config.
  - name: Content policy
    description: >-
      What the model-backed content policy check did, and the matches an
      operator reversed and kept as samples for improving a policy's wording.
  - name: Word filter
    description: The word and vulgarity filter's custom word and phrase list.
  - name: FAQ
    description: Canned command and keyword replies.
  - name: Join links
    description: The public invite links a community's platforms page lists.
  - name: Platform connections
    description: One credentialed presence of a shared bot inside one community space.
  - name: IRC networks
    description: A community's IRC network connections (per_room or hub mode).
  - name: Fluxer instances
    description: A community's flagship and self-hosted Fluxer connections.
  - name: Integrations
    description: >-
      A deployment-wide connection to an outside service, e.g. LibreTranslate.
      Administrator only, and read only through this API: a connection is
      written and tested through the dashboard.
  - name: Guest invites
    description: Time-bounded, token-gated links into the guest chat portal.
  - name: Events
    description: Scheduled events with RSVPs, room-scoped.
  - name: Moderation
    description: Active manual mutes, issued and lifted by an administrator.
  - name: Alerts
    description: What a community's scripts raised for its operators, and whether anybody has looked.
  - name: Room games
    description: >-
      The session, round count and standings behind a script's trivia, poll
      or Q&A, room-scoped, and a way to close a session that is stuck.
  - name: Scripts
    description: Operator authored scripts, the outbound endpoints they may call, and the numbers they record. Administrator only.
  - name: Files
    description: Files rubotty is holding for a community, and the links that reach them. Administrator only.
  - name: Viewers
    description: >-
      Who reads every community in the deployment and changes nothing. Granted
      and revoked by an administrator alone, on top of a floor the deployment
      ships with.
  - name: Administrators
    description: >-
      Who administers every community in the deployment. Granted and revoked
      by an administrator alone, on top of a floor the deployment ships with.
  - name: Tokens
    description: >-
      Credentials somebody is handed so that sending one to the bot grants them
      a role. Shown once when minted, spent on first use, revocable until then.
  - name: Backfill
    description: >-
      What a gap sweep held back instead of sending, per channel, and the
      decision it is waiting on. Administrator only.
  - name: Admin
    description: Administrator-only resources. A developer key gets 403 whichever community it names.

paths:
  # ------------------------------------------------------------------
  # health
  # ------------------------------------------------------------------
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: >-
        Unauthenticated, and the only route that answers anything other than YAML.
        Returns the plain text `ok`.
      security: []
      tags: [Health]
      responses:
        "200":
          description: The process is up.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  # ------------------------------------------------------------------
  # communities
  # ------------------------------------------------------------------
  /communities/{slug}:
    get:
      operationId: getCommunity
      summary: Read a community
      description: >-
        A developer key reads only its own community and an
        administrator key reads any. A slug outside a developer key's
        scope answers 404, exactly like an unknown slug.
      tags: [Communities]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          $ref: "#/components/responses/Community"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities:
    get:
      operationId: listCommunitiesAdmin
      summary: List every community
      description: Administrator only. A developer key gets 403, which confirms nothing about any particular community.
      tags: [Admin, Communities]
      responses:
        "200":
          description: Every community, ordered by slug.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  communities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Community"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # deployment level: gateway accounts and issued keys
  # ------------------------------------------------------------------
  /admin/accounts:
    get:
      operationId: listAccountsAdmin
      summary: List the deployment's credentialed gateway accounts
      description: >-
        An account is a deployment-level shared credential with no
        community attached. `settings` carries the NAME of the
        environment variable holding the token plus per-adapter
        behaviour flags, never a raw secret.
      tags: [Admin]
      responses:
        "200":
          description: Every account.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/accounts/{adapter}/{name}:
    get:
      operationId: getAccountAdmin
      summary: Read one account by adapter and name
      description: The pair is the whole address, since an account belongs to the deployment rather than to a tenant.
      tags: [Admin]
      parameters:
        - name: adapter
          in: path
          required: true
          schema: { type: string }
          example: telegram
          description: Which platform the account is on.
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: telegram
          description: The account's name, unique for that adapter.
      responses:
        "200":
          description: The account.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/api-keys:
    get:
      operationId: listApiKeysAdmin
      summary: List every issued API key
      description: >-
        Administrator only. Carries the public id, scope, label and usage
        stamps, never a token: only a token's digest is ever stored, so there
        is nothing here to hand back.
      tags: [Admin]
      responses:
        "200":
          description: Every API key, newest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # action permissions: the deployment-wide ceiling on what any operator
  # may change
  # ------------------------------------------------------------------
  /admin/action-permissions:
    get:
      operationId: listActionPermissions
      summary: List the deployment-wide ceiling on what an operator may change
      description: >-
        Administrator only. One row per action in the catalog: a toggle and a
        configure grant per feature, plus a handful of whole-section grants
        (moderate_user, manage_rooms, manage_discovered,
        manage_operator_requests, manage_redirection, manage_alerts,
        manage_webhooks, manage_participation). Governs every community
        identically, it is not a per-community setting. An individual
        operator's own grant (see /communities/{slug}/operators) narrows
        within whatever this allows; it can never widen past it. The same
        table the dashboard's Operators page checkbox grid reads and writes.
      tags: [Admin]
      responses:
        "200":
          description: Every action in the catalog, with its current state.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActionPermission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: setActionPermissions
      summary: Replace the deployment-wide ceiling on what an operator may change
      description: >-
        Administrator only. A full replace, not a merge: every action in the
        catalog is set from this one body. An action is writable only when
        its value is truthy; anything omitted, or sent explicitly false,
        becomes not writable. Sending only the actions meant to end up
        writable is the normal shape of a call here.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/ActionPermissionWrite"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ActionPermissionWrite"
      responses:
        "200":
          description: Every action in the catalog, with its now-current state.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActionPermission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # integrations: deployment-wide connections to outside services
  # ------------------------------------------------------------------
  /admin/integrations:
    get:
      operationId: listIntegrationsAdmin
      summary: List every known integration
      description: >-
        A deployment-wide connection to an outside service, e.g.
        LibreTranslate. Every integration this deployment knows about is
        listed, configured or not; one nobody has set up yet still appears,
        with url null and api_key_set false. Read only: every write goes
        through the dashboard, which is also where a connection is tested.
      tags: [Integrations, Admin]
      responses:
        "200":
          description: Every known integration.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/integrations/{name}:
    get:
      operationId: getIntegrationAdmin
      summary: Read one integration by name
      description: >-
        404 only for a name this deployment has never heard of. A known
        integration nobody has configured yet still answers 200, with url
        null and api_key_set false.
      tags: [Integrations, Admin]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: libretranslate
          description: Which integration this is.
      responses:
        "200":
          description: The integration.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateIntegrationAdmin
      summary: Save an integration's connection
      description: >-
        Creates the row on the first save, or edits it after. A field the
        body leaves out keeps its current value. api_key additionally
        treats a blank value the same as an absent one, so there is no way
        to clear a stored key through this body, only replace it.
      tags: [Integrations, Admin]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: openarc
          description: Which integration this is.
      requestBody:
        $ref: "#/components/requestBodies/IntegrationWrite"
      responses:
        "200":
          description: The integration, as saved.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # viewers
  #
  # A viewer reads every community in the deployment and changes nothing
  # anywhere. Administrator only on every verb, because the dimension spans
  # the whole deployment: a developer key confined to one community must
  # never be able to hand out oversight of the rest.
  # ------------------------------------------------------------------
  /admin/viewers:
    get:
      operationId: listViewersAdmin
      summary: List who reads every community
      description: >-
        Two lists. `viewers` are the granted rows, which this API can revoke;
        `baked_in` are the handles the deployment ships with, which it cannot.
        Resolution is the union of the two.
      tags: [Viewers, Admin]
      responses:
        "200":
          description: Everyone who reads every community, by source.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  viewers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Viewer"
                  baked_in:
                    type: array
                    items:
                      $ref: "#/components/schemas/BakedInViewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: grantViewerAdmin
      summary: Grant viewer status to a handle
      description: >-
        Binds the grant to the platform's stable native user identifier. Supply
        native_id, or name a handle with exactly one identity already observed by
        this deployment. A full Matrix ID or scoped IRC account may identify itself;
        unknown or ambiguous handles are refused with 422. Repeating a grant for the
        same platform and native identity answers the existing entry.
        Handles and display names alone never authorize a user. A handle the
        deployment already ships with is refused, since that floor is not revocable.
      tags: [Viewers, Admin]
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/ViewerGrant"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ViewerGrant"
      responses:
        "201":
          description: The handle now reads every community.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Viewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/viewers/{id}:
    delete:
      operationId: revokeViewerAdmin
      summary: Take viewer status back
      description: >-
        Refused with 422 when the deployment also ships with that handle:
        removing the entry would read as a revocation while the shipped floor
        kept handing the same person every community.
      tags: [Viewers, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: The handle no longer reads every community. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/viewer-requests:
    get:
      operationId: listViewerRequestsAdmin
      summary: List open requests to read every community
      description: >-
        Filed by DMing the bot. Only an administrator decides one, which is the
        one place this differs from an operator request: an operator request is
        decided by an operator of that community, and this one spans them all.
      tags: [Viewers, Admin]
      responses:
        "200":
          description: The open requests, oldest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  viewer_requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/ViewerRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/viewer-requests/{id}/approve:
    post:
      operationId: approveViewerRequestAdmin
      summary: Grant a pending viewer request
      description: The request is marked approved and the requester's handle is granted in the same call.
      tags: [Viewers, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The decided request and the entry it produced.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/ViewerRequest"
                  viewer:
                    $ref: "#/components/schemas/Viewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/viewer-requests/{id}/deny:
    post:
      operationId: denyViewerRequestAdmin
      summary: Refuse a pending viewer request
      description: >-
        Grants nothing. A denied request does not block a later one, so
        somebody refused today can ask again.
      tags: [Viewers, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The decided request.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/ViewerRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # administrators
  #
  # An administrator holds the deployment-wide role. The shipped roster is a
  # floor, as it is for viewers, but there is no self-service request path for
  # this highest role.
  # ------------------------------------------------------------------
  /admin/administrators:
    get:
      operationId: listAdministratorsAdmin
      summary: List who administers every community
      description: >-
        Two lists. `administrators` are the granted rows, which this API can
        revoke; `baked_in` are the handles the deployment ships with, which it
        cannot. Resolution is the union of the two.
      tags: [Administrators, Admin]
      responses:
        "200":
          description: Everyone who administers every community, by source.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  administrators:
                    type: array
                    items:
                      $ref: "#/components/schemas/Administrator"
                  baked_in:
                    type: array
                    items:
                      $ref: "#/components/schemas/BakedInAdministrator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: grantAdministratorAdmin
      summary: Grant administrator status to a handle
      description: >-
        Binds the grant to the platform's stable native user identifier. Supply
        native_id, or name a handle with exactly one identity already observed by
        this deployment. A full Matrix ID or scoped IRC account may identify itself;
        unknown or ambiguous handles are refused with 422. Repeating a grant for the
        same platform and native identity answers the existing entry.
        Handles and display names alone never authorize a user. A handle the
        deployment already ships with is refused, since that floor is not revocable.
      tags: [Administrators, Admin]
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/AdministratorGrant"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AdministratorGrant"
      responses:
        "201":
          description: The handle now administers every community.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Administrator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/administrators/{id}:
    delete:
      operationId: revokeAdministratorAdmin
      summary: Take administrator status back
      description: >-
        Refused with 422 when the deployment also ships with that handle:
        removing the entry would read as a revocation while the shipped floor
        kept handing the same person every community.
      tags: [Administrators, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: The handle no longer administers every community. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # tokens that hand somebody a role
  # ------------------------------------------------------------------
  /admin/auth-tokens:
    get:
      operationId: listAuthTokensAdmin
      summary: List every token that hands somebody a role
      description: >-
        Every token this deployment has, community scoped ones included, since
        an administrator is who has to be able to account for all of them. The
        token strings themselves are not here and cannot be: only their digests
        are kept.
      tags: [Tokens, Admin]
      responses:
        "200":
          description: The tokens, newest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  auth_tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: mintDeploymentAuthToken
      summary: Mint a token that hands over reading every community
      description: >-
        Administrator only, because the token IS the grant: it is taken in
        advance, so anything a developer key could mint here would go around
        the check on handing that role over directly. A token minted for one
        community belongs on that community's own path instead.


        The answer carries the token string, and it is the only time it is ever
        readable. Whoever holds it is granted the role by sending the bot
        `/auth` and the string, once, before it expires.
      tags: [Tokens, Admin]
      requestBody:
        required: false
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/DeploymentAuthTokenMint"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeploymentAuthTokenMint"
      responses:
        "201":
          description: The token, shown once.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/IssuedAuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/auth-tokens/{public_id}:
    delete:
      operationId: revokeAuthTokenAdmin
      summary: Take a token back before it is used
      description: >-
        Refused with 422 once the token has been redeemed. The role it carried
        is already granted by then, so revoking it would say something untrue;
        take the role itself back instead.
      tags: [Tokens, Admin]
      parameters:
        - $ref: "#/components/parameters/authTokenPublicId"
      responses:
        "204":
          description: The token no longer works. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # rooms
  # ------------------------------------------------------------------
  /communities/{slug}/rooms:
    get:
      operationId: listRooms
      summary: List a community's rooms
      description: >-
        Each room lists the endpoint keys of the channels bridged into it, so a
        client never has to make a second call to learn what a room spans.
      tags: [Rooms]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Every room in the community.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/rooms/{room_key}:
    get:
      operationId: getRoom
      summary: Read a single room
      description: >-
        A room key is unique within one community, never globally.
        Another community's room answers the same 404 as a room that
        does not exist.
      tags: [Rooms]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      responses:
        "200":
          description: The room.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # live messaging
  # ------------------------------------------------------------------
  /communities/{slug}/rooms/{room_key}/messages:
    post:
      operationId: postRoomMessage
      summary: Post a message into a room
      description: >-
        Enqueues a message for delivery to every platform bridged into
        the room. Answers 201 with the status `queued`.

        A queued message has not yet been delivered. It is screened by
        the community's moderation settings first, and one they reject
        is dropped with no further notice here.

        Reachable with a developer key for its own community. Another
        community's room answers the same 404 as a room that does not
        exist.
      tags: [Messaging]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MessageWriteBody"
          application/yaml:
            schema:
              $ref: "#/components/schemas/MessageWriteBody"
      responses:
        "201":
          description: The post was accepted onto the queue. No platform has seen it yet.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued]
                  id:
                    type: integer
                    description: >-
                      This message's id, an integer on the wire even though the
                      path parameter that carries it back is spelled as a
                      string. Address it with PATCH, DELETE or a
                      reactions call on .../rooms/{room_key}/messages/{message_id}
                      to act on it later.
                  room_key: { type: string }
                required: [status, id, room_key]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: The body was empty, or longer than 4000 characters.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # meta-level message actions: react, edit and delete a message the
  # room-level POST above minted, addressed by room and that same id,
  # never by a bridge channel_id. /bridge/channels/... below stays exactly
  # as it is, correct for a platform_account scoped integration acting as
  # one specific bridged system; this is the equivalent surface for a
  # normal developer or administrator key operating at the room level,
  # with no bridge knowledge required.
  # ------------------------------------------------------------------
  /communities/{slug}/rooms/{room_key}/messages/{message_id}:
    patch:
      operationId: editRoomMessage
      summary: Edit a message posted through POST .../rooms/{room_key}/messages
      description: >-
        Fans the edit out to every channel that message actually landed
        in. Answers 202 with the status `queued`.

        Reachable with a developer key for its own community. Another
        community's room, and a message_id the message map holds nothing
        for (made up, belonging to a different room, or aged out of the
        map's TTL), both answer the same 404.
      tags: [Messaging]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - $ref: "#/components/parameters/roomMessageId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MetaEditWriteBody"
          application/yaml:
            schema:
              $ref: "#/components/schemas/MetaEditWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: The body was empty, or longer than 4000 characters.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteRoomMessage
      summary: Delete a message posted through POST .../rooms/{room_key}/messages
      description: >-
        Fans the delete out to every channel that message actually landed
        in. Answers 202 with the status `queued`.
      tags: [Messaging]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - $ref: "#/components/parameters/roomMessageId"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/rooms/{room_key}/messages/{message_id}/reactions:
    put:
      operationId: addRoomMessageReaction
      summary: Add a reaction to a message posted through POST .../rooms/{room_key}/messages
      description: >-
        Fans the reaction out to every channel that message actually
        landed in, on behalf of the calling key itself rather than a
        remote person, since this key has no such identity to name.
      tags: [Messaging]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - $ref: "#/components/parameters/roomMessageId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/MetaReactionWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: Neither reaction.emoji nor reaction.custom_id was given.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeRoomMessageReaction
      summary: Remove a reaction from a message posted through POST .../rooms/{room_key}/messages
      tags: [Messaging]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - $ref: "#/components/parameters/roomMessageId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/MetaReactionWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: Neither reaction.emoji nor reaction.custom_id was given.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/rooms/{room_key}/stream:
    get:
      operationId: streamRoom
      summary: Watch a room live, as server-sent events
      description: >-
        Server-sent events over the seconds-long buffer the bridge
        writes at fan-out.

        Every frame carries a YAML document. SSE joins consecutive
        `data:` lines with a newline before the client sees them, so a
        multi-line YAML document rides one line per frame line and
        reassembles exactly. Each frame carries an `id:`, which a
        browser echoes back as `Last-Event-ID` on a reconnect. Comment
        frames beginning `:` are heartbeats and carry nothing.

        The first frame arrives immediately with an empty `messages`
        list, so a client confirms the stream is live and pins its
        cursor even on a silent room.

        There is no backlog to ask for. A subscriber with no cursor
        starts at the current head, and the buffer prunes within seconds
        either way.

        New messages only. An edit, a delete or a reaction takes its own
        path through the bridge and never reaches this buffer.
      tags: [Messaging]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - name: since
          in: query
          required: false
          schema: { type: integer }
          description: >-
            Resume after this cursor. Omitted, the stream starts at the room's
            current head. A `Last-Event-ID` request header does the same thing,
            which is what makes a browser's automatic reconnect resume cleanly.
      responses:
        "200":
          description: >-
            An open event stream. The schema below describes ONE frame's YAML
            document, which is what the `data:` lines of each frame carry.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always no-cache.
            X-Accel-Buffering:
              schema: { type: string }
              description: Always "no", so a buffering reverse proxy does not hold frames back.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamFrame"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # bridge: a remote system posting in as a first party platform
  # ------------------------------------------------------------------
  /communities/{slug}/bridge/channels/{channel_id}/messages:
    post:
      operationId: postBridgeMessage
      summary: Post a message from a bridged remote system
      description: >-
        Enqueues a message for delivery to every OTHER platform bridged
        into the same room. Answers 201 with the new message's id, which
        a later edit, delete or reaction on this same message addresses.

        Reachable only with an API key scoped to one platform_account
        (see the API key resource). An ordinary developer or
        administrator key, a channel_id this account has no mapping for,
        and another community's slug all answer the same 404.
      tags: [Bridge]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/channelId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BridgeMessageWriteBody"
      responses:
        "201":
          description: The post was accepted onto the queue. No platform has seen it yet.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/BridgeMessageQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: The body and every attachment were both empty, or the body was over 4000 characters.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/bridge/channels/{channel_id}/messages/{message_id}:
    patch:
      operationId: editBridgeMessage
      summary: Edit a message a bridged remote system posted earlier
      tags: [Bridge]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/channelId"
        - $ref: "#/components/parameters/messageId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BridgeEditWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: The body was empty.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteBridgeMessage
      summary: Delete a message a bridged remote system posted earlier
      tags: [Bridge]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/channelId"
        - $ref: "#/components/parameters/messageId"
      requestBody:
        required: false
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BridgeAuthorOnlyBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/bridge/channels/{channel_id}/messages/{message_id}/reactions:
    put:
      operationId: addBridgeReaction
      summary: Add a reaction to a message on a bridged remote system
      description: >-
        Placed on behalf of the author named in the body, not the
        integration itself: several different remote people may each
        hold their own reaction on the same message.
      tags: [Bridge]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/channelId"
        - $ref: "#/components/parameters/messageId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BridgeReactionWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: Neither reaction.emoji nor reaction.custom_id was given.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeBridgeReaction
      summary: Remove a reaction from a message on a bridged remote system
      tags: [Bridge]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/channelId"
        - $ref: "#/components/parameters/messageId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BridgeReactionWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: Neither reaction.emoji nor reaction.custom_id was given.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/bridge/channels/{channel_id}/members:
    post:
      operationId: addBridgeMember
      summary: Report a member arriving in a channel on a bridged remote system
      description: >-
        A member joining, carried as a membership event rather than as a
        chat line, so a room can tell arriving apart from talking. A game
        server's stream is mostly this. The member is named in the body,
        the same as the author of any other call here.
      tags: [Bridge]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/channelId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BridgeMemberWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: No author.id was given, so the event names nobody.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeBridgeMember
      summary: Report a member leaving a channel on a bridged remote system
      tags: [Bridge]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/channelId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BridgeMemberWriteBody"
      responses:
        "202":
          $ref: "#/components/responses/BridgeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          description: No author.id was given, so the event names nobody.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # channels
  # ------------------------------------------------------------------
  /communities/{slug}/channels:
    get:
      operationId: listChannels
      summary: List a community's channels
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Every channel in the community.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/channels/{endpoint_key}:
    get:
      operationId: getChannel
      summary: Read a single channel
      description: >-
        An endpoint key is globally unique, but the lookup is still
        scoped to the named community, so a developer key cannot reach
        another community's channel by guessing its key.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/endpointKey"
      responses:
        "200":
          description: The channel.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # people and operators
  # ------------------------------------------------------------------
  /communities/{slug}/people:
    get:
      operationId: listPeople
      summary: List the community's passively observed identity directory
      description: >-
        There is no create verb anywhere for this resource. A person appears by
        being observed talking, and is never authored from nothing. Each one
        carries the names they are bridged as, keyed by the platform each is
        shown on, which is the same answer the operator dashboard's people page
        renders.
      tags: [People]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Everyone the community has observed.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/people/{id}:
    get:
      operationId: getPerson
      summary: Read a single person
      tags: [People]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The person, every identity linked to them, and what they are bridged as.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/people/{id}/nicknames/{adapter}:
    put:
      operationId: setNickname
      summary: Set the name this person is bridged as on one platform
      description: >-
        The platform in the path is where the name is SHOWN, never where the
        person was observed, matching the argument the chat command takes. The
        whole person comes back, so what actually saved can be read rather than
        assumed. First come wins within a community and platform: a name
        somebody else already answers to there is refused with 422, as is a
        name a community that hands out none at all would never have accepted.
      tags: [People]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/nicknameAdapter"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/NicknameWriteBody"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NicknameWriteBody"
      responses:
        "200":
          description: The person, with the name now held on that platform.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: clearNickname
      summary: Drop the name this person is bridged as on one platform
      description: >-
        They go back to whatever label the bridge would otherwise build for
        them. Answers 404 when they hold no name on that platform. Unlike the
        set above this is never refused on the community's own policy: clearing
        a name that has become a problem is the lever an operator keeps
        whatever that policy is.
      tags: [People]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/nicknameAdapter"
      responses:
        "204":
          description: They hold no name on that platform any more. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/operators:
    get:
      operationId: listOperators
      summary: List the community's operators
      description: >-
        Everyone who may moderate here, from both sources, in one list. An
        entry is either a granted record, which the revoke route can remove,
        or one of the handles the deployment ships with, which is owner-level
        in every community and can be removed nowhere. `baked_in` and
        `removable` say which is which on every entry, and the shipped handles
        come first. Reading only the granted records would report that nobody
        moderates a community several people do.
      tags: [Operators]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Everyone who may moderate this community, by source.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  operators:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/BakedInOperator"
                        - $ref: "#/components/schemas/Operator"
                required: [operators]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/operators:
    post:
      operationId: grantOperator
      summary: Make somebody an operator of this community
      description: >-
        Administrator-only, which is the whole reason this write sits under
        `/admin/` while the list above stays on the ordinary community path:
        reading who runs a community a key already reaches tells that key
        nothing new, and deciding who runs it is a different thing entirely.
        Named by platform account rather than by person, since the person may
        have no record yet; one is created for them, the same way approving
        their request would. Idempotent: somebody already an operator keeps the
        record and the scope they have.
      tags: [Operators]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/OperatorGrant"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OperatorGrant"
      responses:
        "201":
          description: The granted record.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/operators/{id}:
    delete:
      operationId: revokeOperator
      summary: Stop somebody operating this community
      description: >-
        Refused with 422 for somebody the deployment also ships with as an
        owner: the record would go while the shipped floor kept handing them
        the same access here and everywhere else, so the call would read as a
        revocation and would not be one. Those entries carry `removable: false`
        on the list above.
      tags: [Operators]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: They no longer operate this community. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/operator-requests:
    get:
      operationId: listOperatorRequests
      summary: List the community's operator requests
      description: Every request whatever its state, not only the open ones.
      tags: [Operators]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Every operator request.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  operator_requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperatorRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/operator-requests/{id}:
    get:
      operationId: getOperatorRequest
      summary: Read a single operator request
      tags: [Operators]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The operator request.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/OperatorRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # community viewers
  #
  # A community viewer reads ONE community and changes nothing in it. On the
  # ordinary community path rather than under /admin/..., which is the whole
  # difference from the deployment-wide dimension: a developer key confined to
  # this community may hand this out, because it reaches no further than that
  # key already reaches.
  # ------------------------------------------------------------------
  /communities/{slug}/viewers:
    get:
      operationId: listCommunityViewers
      summary: List who reads this community
      description: >-
        Two lists. `viewers` are the granted entries for this community, which
        this API can revoke; `baked_in` are the handles the deployment ships
        with, which read every community and cannot be revoked anywhere.
      tags: [Viewers]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Everyone who reads this community without operating it, by source.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  viewers:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityViewer"
                  baked_in:
                    type: array
                    items:
                      $ref: "#/components/schemas/BakedInViewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: grantCommunityViewer
      summary: Let a handle read this community
      description: >-
        Binds the grant to the platform's stable native user identifier. Supply
        native_id, or name a handle with exactly one identity already observed by
        this deployment. A full Matrix ID or scoped IRC account may identify itself;
        unknown or ambiguous handles are refused with 422. Repeating a grant for the
        same platform and native identity answers the existing entry.
        Handles and display names alone never authorize a user. A handle the
        deployment already ships with is refused, since that floor is not revocable.
      tags: [Viewers]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/ViewerGrant"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ViewerGrant"
      responses:
        "201":
          description: The handle now reads this community.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/CommunityViewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/viewers/{id}:
    delete:
      operationId: revokeCommunityViewer
      summary: Stop a handle reading this community
      description: >-
        Refused with 422 when the deployment also ships with that handle:
        removing the entry would read as a revocation while the shipped floor
        kept handing the same person every community.
      tags: [Viewers]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: The handle no longer reads this community. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/viewer-requests:
    get:
      operationId: listCommunityViewerRequests
      summary: List open requests to read this community
      description: >-
        Filed by DMing the bot `/role viewer`. An operator of this community
        decides one, which is the difference from the deployment-wide queue:
        that one reads every other community too, so only an administrator
        decides it.
      tags: [Viewers]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The open requests, oldest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  viewer_requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityViewerRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/viewer-requests/{id}/approve:
    post:
      operationId: approveCommunityViewerRequest
      summary: Grant a pending request to read this community
      description: The request is marked approved and the requester's handle is granted in the same call.
      tags: [Viewers]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The decided request and the entry it produced.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/CommunityViewerRequest"
                  viewer:
                    $ref: "#/components/schemas/CommunityViewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/viewer-requests/{id}/deny:
    post:
      operationId: denyCommunityViewerRequest
      summary: Refuse a pending request to read this community
      description: >-
        Grants nothing. A denied request does not block a later one, so
        somebody refused today can ask again.
      tags: [Viewers]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The decided request.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/CommunityViewerRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/auth-tokens:
    get:
      operationId: listCommunityAuthTokens
      summary: List the tokens that hand somebody a role here
      description: >-
        The tokens minted for this one community. The token strings are not
        here and cannot be: only their digests are kept.
      tags: [Tokens]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The tokens, newest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  auth_tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: mintCommunityAuthToken
      summary: Mint a token that hands over a role in this community
      description: >-
        Operator here, viewer here, or both, and at least one of the two. The
        scope is the path's: nothing in the body can widen a token past this
        community, which is why an operator of it may mint one.


        A developer key may hand over the viewer, which changes nothing here.
        Handing over operator is refused with 422 for a developer key and needs
        an administrator key, because a developer key is read-write inside one
        community without being an operator of it, and a token making a human
        operator would reach past what the key holds.


        The answer carries the token string, and it is the only time it is ever
        readable. Whoever holds it is granted the role by sending the bot
        `/auth` and the string, once, before it expires.
      tags: [Tokens]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/CommunityAuthTokenMint"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CommunityAuthTokenMint"
      responses:
        "201":
          description: The token, shown once.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/IssuedAuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/auth-tokens/{public_id}:
    delete:
      operationId: revokeCommunityAuthToken
      summary: Take a token back before it is used
      description: >-
        Refused with 422 once the token has been redeemed. The role it carried
        is already granted by then, so revoking it would say something untrue;
        take the role itself back instead.
      tags: [Tokens]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/authTokenPublicId"
      responses:
        "204":
          description: The token no longer works. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # discovery and automatic mapping
  # ------------------------------------------------------------------
  /communities/{slug}/discovered-channels:
    get:
      operationId: listDiscoveredChannels
      summary: List discovered, unmapped channels awaiting an operator's decision
      description: The same todo list the operator dashboard's discovered-channels page shows.
      tags: [Discovery]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Channels a sweep found that belong to no room yet.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  discovered_channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/discovered-channels/mapping-proposals:
    get:
      operationId: listMappingProposals
      summary: Propose a room for each discovered, unmapped channel
      description: >-
        Works out, by comparing names, which discovered channels match
        an existing room and which want a new one. Writes nothing, so a
        client can show the proposals to a human before anything
        happens.

        An ambiguous channel, meaning two channels claiming one room or
        one channel matching two rooms, comes back with the action
        `skip` and a reason rather than being left out of the list.
      tags: [Discovery]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: One proposal per discovered, unmapped channel.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/MappingProposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/discovered-channels/mapping-proposals/apply:
    post:
      operationId: applyMappingProposals
      summary: Map the named channels into the named rooms
      description: >-
        Applies only the entries in the body, so a caller filters out
        the proposals it disagrees with.

        An entry naming a channel that is no longer
        discovered-and-unmapped is skipped, since a proposal can go
        stale between reading and applying. Compare `applied` with
        `requested` to see whether that happened.

        Form encoding carries the list using the usual bracket notation,
        `mappings[][endpoint_key]`.
      tags: [Discovery]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MappingApplyBody"
          application/yaml:
            schema:
              $ref: "#/components/schemas/MappingApplyBody"
      responses:
        "200":
          description: How many entries were asked for and how many actually landed.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  applied:
                    type: integer
                    description: How many entries were actually mapped.
                  requested:
                    type: integer
                    description: How many entries the body carried.
                required: [applied, requested]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/discovered-channels/{endpoint_key}/map:
    post:
      operationId: mapDiscoveredChannel
      summary: Map one discovered channel into a room
      description: >-
        The single-channel form of applying a mapping. The bulk apply takes a
        whole list and skips whatever went stale between reading and
        submitting; this takes one channel and says plainly when it cannot be
        mapped.


        Name the destination one of three ways: `room_key` for a room that
        already exists, or a fresh room under that key; `partner` for another
        discovered, unmapped channel to seed a new room alongside; or `solo`
        for a room holding this channel alone. Naming none of them is refused.


        Mapping enables no feature. The channel is linked into the room's
        topology and stays as dormant as it was.


        A channel that is no longer discovered-and-unmapped answers 404,
        exactly as one that never existed does.
      tags: [Discovery]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/endpointKey"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MapChannelBody"
          application/yaml:
            schema:
              $ref: "#/components/schemas/MapChannelBody"
      responses:
        "200":
          description: The room the channel landed in, and everything now in it.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  room:
                    $ref: "#/components/schemas/Room"
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Channel"
                required: [room, channels]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # suggested channels
  #
  # A channel a NON-operator named, which lands as a suggestion rather than
  # being taken at its word. On the ordinary community path, matching the
  # discovered-channel routes above: the same page settles both, and neither
  # reaches past the community named in the path.
  # ------------------------------------------------------------------
  /communities/{slug}/suggested-channels:
    get:
      operationId: listSuggestedChannels
      summary: Channels a non-operator named, waiting on a decision
      description: >-
        When somebody who does not operate the community runs the topic
        command, the channel is recorded as a suggestion instead of being
        taken as identified. Each one reads as an ordinary channel plus the id
        the approve and reject routes address it by. Oldest first.
      tags: [Discovery]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Every suggestion still waiting on a decision.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  suggested_channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/SuggestedChannel"
                required: [suggested_channels]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/suggested-channels/{id}/approve:
    post:
      operationId: approveSuggestedChannel
      summary: Keep a suggested channel
      description: >-
        It stops being a suggestion and nothing else about it changes: the
        label it was named with stands, and it joins no room by being approved.
        A suggestion already settled is not found.
      tags: [Discovery]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The channel, no longer a suggestion.
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/SuggestedChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/suggested-channels/{id}/reject:
    post:
      operationId: rejectSuggestedChannel
      summary: Drop a suggested channel
      description: >-
        The record goes outright, which is why there is nothing to answer
        with. Only a channel still waiting on a decision is ever reachable
        here, so an approved channel cannot be removed by guessing an id.
      tags: [Discovery]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: The suggestion is gone. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # onboarding
  # ------------------------------------------------------------------
  /admin/pending-spaces:
    get:
      operationId: listPendingSpaces
      summary: Spaces the bot was added to that no community owns yet
      description: >-
        The review queue. A space the bot is added to posts a one-time notice,
        waits here for a decision, and leaves on its own if none arrives.


        Administrator only, and named by no slug, because a pending space
        belongs to no community: there is nothing for a developer key to be
        scoped to, and a space awaiting a decision may turn out to be
        somebody else's.
      tags: [Onboarding, Admin]
      parameters:
        - $ref: "#/components/parameters/pendingSpaceState"
      responses:
        "200":
          description: The spaces in the state asked for.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  pending_spaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingSpace"
                required: [pending_spaces]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/pending-spaces/{id}:
    get:
      operationId: getPendingSpace
      summary: Read one space awaiting a decision
      tags: [Onboarding, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PendingSpace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: clearPendingSpace
      summary: Drop a refused space, so it may be reviewed again
      description: >-
        A refused row stays as a standing refusal: the same space rejoining is
        turned away without a second review. Clearing it means a later join
        starts a fresh review.


        Only a refused row can be cleared. A row still awaiting a decision is
        settled through approve or reject instead, and asking to clear one is
        a 422.
      tags: [Onboarding, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: The row was dropped. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/pending-spaces/{id}/approve:
    post:
      operationId: approvePendingSpace
      summary: Accept a space onto an existing community, or as a new one
      description: >-
        Name an existing community's slug in `community`, or a name for a
        brand new community in `new_community_name`. Naming neither is a 422.


        Approving writes the platform connection and nothing else: no room, no
        channel mapping, no feature. The community stays dormant until
        somebody maps a channel into a room, so accepting a space never turns
        anything on by itself.


        A space that has already been decided answers 422, and no second
        decision is recorded.
      tags: [Onboarding, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PendingSpaceApproveBody"
          application/yaml:
            schema:
              $ref: "#/components/schemas/PendingSpaceApproveBody"
      responses:
        "200":
          description: The decided space and the community it now belongs to.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  pending_space:
                    $ref: "#/components/schemas/PendingSpace"
                  community:
                    $ref: "#/components/schemas/Community"
                required: [pending_space, community]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/pending-spaces/{id}/reject:
    post:
      operationId: rejectPendingSpace
      summary: Refuse a space and leave it
      description: >-
        The decision is recorded at once. This process holds no platform
        connections of its own, so the departure itself is scheduled for
        whichever bot process is running and lands shortly afterwards.


        The row stays as a standing refusal, so the same space rejoining is
        turned away without a second review, until it is cleared.
      tags: [Onboarding, Admin]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PendingSpace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/space-suggestions:
    get:
      operationId: listSpaceSuggestions
      summary: Which pending spaces look like they belong to this community
      description: >-
        Guesses, by comparing the space's name against the community's name
        and slug. Nothing here writes and nothing here decides: a suggestion
        is accepted by approving that pending space.


        The matching is deliberately mean, since attaching a stranger's group
        to somebody's community is far worse than showing no suggestion at
        all. A space that matches two communities is suggested to neither, and
        a space that matches none is still in the review queue.


        Administrator only, because a pending space belongs to no community
        and a guess about one is still a look at somebody else's space.
      tags: [Onboarding, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The suggestions for this community, possibly none.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpaceSuggestion"
                required: [suggestions]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # features
  # ------------------------------------------------------------------
  /communities/{slug}/features:
    get:
      operationId: listCommunityFeatures
      summary: List the community-wide feature defaults
      description: Every feature with no room override.
      tags: [Features]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The community-wide defaults.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items:
                      $ref: "#/components/schemas/Feature"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/features/{feature}:
    get:
      operationId: getCommunityFeature
      summary: Read the community-wide default for one feature
      tags: [Features]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/feature"
      responses:
        "200":
          $ref: "#/components/responses/Feature"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: setCommunityFeature
      summary: Set the community-wide default's enabled state and config
      description: >-
        A body may set `enabled` alone, `config` alone, or both in one
        request. Each config key runs through the same coercion a
        command-line or dashboard edit takes: booleans, numbers, comma
        lists, explicit JSON, or a plain string. The response is the
        resulting row.
      tags: [Features]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/feature"
      requestBody:
        $ref: "#/components/requestBodies/FeatureWrite"
      responses:
        "200":
          $ref: "#/components/responses/Feature"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/rooms/{room_key}/features:
    get:
      operationId: listRoomFeatures
      summary: List a room's own explicitly set feature overrides
      description: >-
        Only what has been set for this room, rather than the value it
        would resolve to at runtime by inheriting the community default.
        A room with no override for a feature is absent from this list.
      tags: [Features]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
      responses:
        "200":
          description: The room's own overrides.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items:
                      $ref: "#/components/schemas/Feature"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /communities/{slug}/rooms/{room_key}/features/{feature}:
    get:
      operationId: getRoomFeature
      summary: Read what a feature resolves to for one room
      description: >-
        What is actually in force for this room: its own override when it has
        one, otherwise the community-wide default it falls back to. `inherited`
        says which of the two answered, and `room_key` names the room asked
        about either way.


        The list beside this one answers a different question, namely what has
        been set on the room explicitly, so a room with no override of its own
        is simply absent from it.


        404 only when neither the room nor the community has ever configured
        the feature.
      tags: [Features]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - $ref: "#/components/parameters/feature"
      responses:
        "200":
          $ref: "#/components/responses/RoomFeature"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: setRoomFeature
      summary: Set a room's enabled state and config for one feature
      tags: [Features]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - $ref: "#/components/parameters/feature"
      requestBody:
        $ref: "#/components/requestBodies/FeatureWrite"
      responses:
        "200":
          $ref: "#/components/responses/Feature"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: resetRoomFeature
      summary: Reset a room's override, falling back to the community default
      description: >-
        Removes the room's own override so it inherits the
        community-wide default again. 404s when there was no override to
        remove. Only a room-level override is removable; the
        community-wide default is not.
      tags: [Features]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/roomKey"
        - $ref: "#/components/parameters/feature"
      responses:
        "204":
          description: The override was removed. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
  # feature config schema catalog
  # ------------------------------------------------------------------
  /features/schema:
    get:
      operationId: listFeatureSchemas
      summary: Every feature's declared config shape
      description: >-
        What `config` accepts for each feature: the same schema the
        dashboard reads to build its per-feature config form, restated as
        data. Deployment-wide rather than community-scoped, since the shape
        is identical for every community: no slug is named, and a developer
        key reads it the same way an administrator key does.


        This is the authority on config keys, and the only one. The static
        document deliberately describes `config` as an open mapping rather than
        copying these shapes into itself, because the shapes belong to the
        release a deployment is running and this answer comes from the
        deployment being talked to.
      tags: [Features]
      responses:
        "200":
          description: Every known feature's config schema.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeatureSchema"
                required: [features]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ------------------------------------------------------------------
