      operationId: getWebhookAdmin
      summary: Read a single subscription
      tags: [Webhooks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/publicId"
      responses:
        "200":
          $ref: "#/components/responses/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteWebhookAdmin
      summary: Stop sending to this address
      description: >-
        Removes the subscription and its delivery history together. Anything
        still queued for it is dropped rather than sent.
      tags: [Webhooks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/publicId"
      responses:
