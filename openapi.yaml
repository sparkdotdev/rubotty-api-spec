  /admin/communities/{slug}/webhooks:
    get:
      operationId: listWebhooksAdmin
      summary: List where this community's events are sent
      description: >-
        A subscription is a standing instruction to forward what happens
        in a community's rooms to an address outside this deployment.
        The signing secret is never in this response: it is returned
        when the subscription is created and when it is rotated, and at
        no other time.
      tags: [Webhooks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Every subscription in the community, newest first.
          content:
            application/yaml:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createWebhookAdmin
      summary: Subscribe an address to this community's events
      description: >-
        The response carries the signing secret. Keep it: every delivery
        is signed with it, and no other call shows the value again.
        Rotating replaces it.

        Deliveries follow the Standard Webhooks conventions. Each
        request carries `webhook-id`, `webhook-timestamp` and
        `webhook-signature`, and the signature is computed over
        `id.timestamp.body` with HMAC-SHA256, so any off-the-shelf
        Standard Webhooks library verifies it. The body is YAML.

        Delivery is at least once, so a subscriber should deduplicate on
        `webhook-id`. Events reach one subscription in the order they
        happened.
      tags: [Webhooks, Admin]
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        $ref: "#/components/requestBodies/WebhookWrite"
      responses:
        "201":
          $ref: "#/components/responses/WebhookCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/communities/{slug}/webhooks/{public_id}:
